  - id: B024
    title: Auto-promotion/close lifecycle for backlog items
    reason: When backlog items are promoted into a milestone, and when their
      milestone/work is completed, the expected automatic lifecycle transitions
      (promotion, completion, closure) should happen without requiring the
      driver to manually perform state updates. Ensure the behavior is
      driver-independent and enforced by PitWay core rather than relying on the
      AI driver to remember lifecycle commands.
