  - id: B002
    title: Improve milestone reviewer selection UX
    reason: Reviewer selection is difficult to scan because the current
      role/description presentation is visually noisy. Make role names visually
      prominent and descriptions concise.
    status: promoted
    source:
      milestone: M018
