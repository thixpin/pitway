  - id: B001
    title: ms-* milestone command aliases
    reason: Command names discovered during real-world PitWay usage can be
      ambiguous, and milestone commands are unnecessarily long. Standardize
      PitWay ownership in metadata and add ms-* aliases for milestone commands.
