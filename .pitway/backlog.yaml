  - id: B003
    title: Review backlog storage scalability
    reason: .pitway/backlog.yaml is currently designed as the authoritative backlog
      state. While this is appropriate for the initial implementation,
      long-lived projects could accumulate a large number of historical backlog
      items over time. Evaluate whether the backlog should eventually support
      archival, partitioning, or another storage strategy when backlog volume
      grows.
    status: pending
    source:
      milestone: M018
      task: null
    created_at: 2026-08-21T14:24:42.090Z
    resolved_at: null
    promoted_to: null
    archived_reason: null
  - id: B004
    title: Improve CLI test coverage; resolve local-vs-Codecov discrepancy
    reason: Codecov shows several weak CLI files (cli/commands/milestone-review.ts ~43%,
      cli/commands/task-verify.ts ~41%, cli/commands/task-integrate.ts ~50%, 
      cli/commands/verification-repair.ts ~57%, cli/commandsindex.ts ~75%; overall ~87%), 
      while local Vitest V8 numbers read higher for some -- the discrepancy (coverage config, 
      included/excluded files, source maps, report format, Codecov upload config, CI workflow)
      needs investigating before trusting either number. Add meaningful
      behavioral/branch tests for real gaps (error paths, validation failures,
      state-transition failures, subprocess failures, recovery/repair paths)
      prioritized milestone-review > task-verify > task-integrate >
      verification-repair > cli/index, targeting >90% genuine Codecov coverage
      -- never superficial line-only tests, config changes to hide uncovered
      code, or unrelated refactors.
    status: pending
    source:
      milestone: M018
      task: null
