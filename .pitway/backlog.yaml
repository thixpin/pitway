  - id: B017
    title: "Governance: amendments need developer approval"
    reason: Milestone contract amendments must never be applied autonomously. The
      agent may propose an amendment (draft + rationale), but must stop and wait
      for explicit developer approval before the contract is mutated or
      execution continues. Focused governance item; no change to current
      milestone scope.
    status: promoted
    source:
      milestone: M024
