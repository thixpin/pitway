      task: T004
    archived_reason: null
  - id: B003
    title: Review backlog storage scalability
    reason: .pitway/backlog.yaml is currently designed as the authoritative backlog
      state. While this is appropriate for the initial implementation,
      long-lived projects could accumulate a large number of historical backlog
      items over time. Evaluate whether the backlog should eventually support
      archival, partitioning, or another storage strategy when backlog volume
      grows.
    status: promoted
    source:
      milestone: M018
      task: null
    created_at: 2026-08-21T14:24:42.090Z
    resolved_at: 2026-08-21T17:08:41.731Z
    promoted_to:
      milestone: M019
      task: T005
    archived_reason: null
  - id: B004
    title: Improve CLI test coverage; resolve local-vs-Codecov discrepancy
    reason: Codecov shows several weak CLI files (cli/commands/milestone-review.ts
      ~43%, cli/commands/task-verify.ts ~41%, cli/commands/task-integrate.ts
      ~50%, cli/commands/verification-repair.ts ~57%, cli/commandsindex.ts ~75%;
      overall ~87%), while local Vitest V8 numbers read higher for some -- the
      discrepancy (coverage config, included/excluded files, source maps, report
      format, Codecov upload config, CI workflow) needs investigating before
      trusting either number. Add meaningful behavioral/branch tests for real
      gaps (error paths, validation failures, state-transition failures,
      subprocess failures, recovery/repair paths) prioritized milestone-review >
      task-verify > task-integrate > verification-repair > cli/index, targeting
      >90% genuine Codecov coverage -- never superficial line-only tests, config
      changes to hide uncovered code, or unrelated refactors.
    status: promoted
    source:
      milestone: M018
      task: null
    created_at: 2026-08-21T14:35:13.758Z
    resolved_at: 2026-08-21T18:46:07.290Z
    promoted_to:
      milestone: M020
      task: T001
    archived_reason: null
  - id: B005
    title: Align milestone-status/progress-report table format with usage view
    reason: PitWay already integrated a table-view report format that shows usage
      per row elsewhere, but pitway milestone-status --report / the progress
      report still use the older row layout and don't follow that same table
      design. Align them (developer-flagged during M019 execution while
      reviewing milestone-status output).
    status: archived
    source:
      milestone: M019
      task: null
    created_at: 2026-08-21T17:01:18.814Z
    resolved_at: 2026-08-21T18:46:12.221Z
    promoted_to: null
    archived_reason: Resolved directly via quick-change qc-404ee3e9 (commit
      3a297d9), not promoted into a milestone task -- the report's task list now
      shares the table+usage format with plain milestone-status.
  - id: B006
    title: Track token usage and cost in milestone reviews
    reason: "pitway milestone-review has no usage-tracking mechanism: a dispatched
      reviewer subagent's token usage (input/output/total, and estimated cost
      where the provider reports it) is never recorded, unlike task-dispatch's
      --usage MUST rule (M019/T007). Add usage capture to the review-session
      schema and CLI (e.g. milestone-review record --usage <json>), with
      per-role totals and a session-level rollup -- same design discipline as
      task usage: measured only, never estimated, null when unavailable.
      Developer's request also referenced 'per-task' totals; clarify at
      investigation time whether that means per-reviewer-role (the natural
      review-session equivalent) or also unifying with the existing M019/T007
      per-task usage into one combined reporting view."
    status: promoted
    source:
      milestone: M020
      task: null
    created_at: 2026-08-21T18:08:57.064Z
    resolved_at: 2026-08-21T19:14:54.260Z
    promoted_to:
      milestone: M021
      task: T001
    archived_reason: null
  - id: B007
    title: backlog archive needs an active milestone, no override
    reason: "pitway backlog archive <id> unconditionally requires
      state.active_milestone to be non-null, the same M018-designed rule as
      add/list/show/promote -- but archive is a pure terminal-status closure
      with no risk of misattributing a pending mutation to a retired milestone
      the way add's journal-attachment concern was. Hit twice for real: once
      after M018 completed (a backlog item could not be archived standalone),
      and again after M019 completed with qc-404ee3e9 resolving B005 outside any
      milestone task -- the archive had to wait for M020's own active-milestone
      window. Evaluate an --allow-no-active-milestone-style override (or
      equivalent) for archive specifically, without weakening
      add/list/show/promote's existing unconditional requirement."
    status: promoted
    source:
      milestone: M020
      task: null
    created_at: 2026-08-21T18:46:19.193Z
    resolved_at: 2026-08-21T19:14:54.550Z
    promoted_to:
      milestone: M021
      task: T002
    archived_reason: null
  - id: B008
    title: Deduplicate init-generated CLAUDE.md vs AGENTS.md content
    reason: "pitway init writes AGENTS.md and CLAUDE.md with the same 5
      SHARED_BULLETS duplicated verbatim in both
      (src/state/root-instructions.ts), and CLAUDE.md's closing line even says
      'See AGENTS.md for the shared instructions above' -- so a driver that
      reads both files (several do, per docs/evidence/M022: Copilot reads
      AGENTS.md and CLAUDE.md; OpenCode falls back to CLAUDE.md) ingests
      identical content twice. Developer-reported 2026-08-22. Fix direction per
      M022's own finding (claude-code.md section 4): Claude Code's documented
      AGENTS.md bridge is the @AGENTS.md import -- make CLAUDE_MD_CONTENT a thin
      pointer (@AGENTS.md import + the .claude/protocol-driver.md pointer),
      shared bullets living only in AGENTS.md. Migration consideration: changing
      the generated content makes existing installed copies classify as
      'conflict' (preserved-with-warning) rather than 'identical' -- disclose,
      don't silently churn user repos."
    status: promoted
    source:
      milestone: M023
      task: null
    created_at: 2026-08-22T03:55:41.444Z
    resolved_at: 2026-08-22T03:58:05.794Z
    promoted_to:
      milestone: M023
      task: T004
    archived_reason: null
  - id: B009
    title: required_skills gate resolves against .claude/skills/ only
    reason: src/core/tasks/skills.ts's pre-dispatch gate compares required_skills
      against installed skills discovered by listInstalledSkillNames, which
      reads .claude/skills/ only; with the OpenCode driver installed via pitway
      init --opencode, a required_skills declaration is never checked against
      .opencode/skills/. PitWay has no current-driver state to decide which
      directory to resolve against, so there is no principled fix yet. Disclosed
      by M023/AC009 as an intentionally unaddressed limitation, by design; pick
      up if it ever becomes load-bearing.
    status: pending
    source:
      milestone: M023
      task: T003
    created_at: 2026-08-22T04:43:48.885Z
    resolved_at: null
    promoted_to: null
    archived_reason: null
  - id: B010
    title: Racing footer missing from ms-status report and other views
    reason: "Developer-reported 2026-08-22: the one-line racing progress footer
      (M013's computeRacingFooter -- the permanent driver-UX element, e.g. '82%
      . 4/6 . Next: T005') is missing from the milestone-status --report output
      and is also not shown in other places where it should appear. Investigate
      which command outputs are missing the footer (report view, and audit every
      surface that renders milestone progress -- milestone-status default vs
      --report, resume, and any human-render path added since M013, e.g.
      milestone-merge/backlog/task-dispatch outputs) against
      protocol-driver.md's Progress reporting rule (footer non-null once a
      milestone is confirmed), and wire the footer consistently into every
      missing surface."
    status: archived
    source:
      milestone: M024
      task: null
    created_at: 2026-08-22T07:15:42.532Z
    resolved_at: 2026-08-22T07:19:01.318Z
    promoted_to: null
    archived_reason: "Recharacterized after developer correction 2026-08-22: the CLI
      command output is correct (milestone-status/resume do render the racing
      footer) -- the gap was the DRIVER's own chat report rendering omitting the
      footer line from routine progress updates. That is exactly the discipline
      protocol-driver.md's Progress reporting section already mandates and M013
      disclosed PitWay cannot enforce (it can prove the rendering is correct,
      never that a driver session follows the habit). No CLI change needed; the
      driver applies the habit directly."
  - id: B011
    title: Codify driver report style (table + footer relay) in protocol
    reason: "Supersedes archived B010 with the enforceable half, per developer
      directive 2026-08-22: two real driver rendering misses occurred in the
      same session (the racing footer omitted from routine chat updates, then
      the milestone-status per-task table summarized away into prose on an
      /ms-status request). The CLI output is correct in both cases -- the gap is
      driver discipline, and protocol-driver.md's Progress reporting section
      currently mandates only the footer habit loosely. Strengthen the installed
      protocol text (protocol-driver.md Progress reporting, plus
      commands/milestone-status.md and commands/ms-status.md) to explicitly
      require: when relaying milestone-status/resume output to the developer,
      reproduce the command's rendered table and racing footer as-is (verbatim
      structure, annotations added around them, never replacing them with
      prose), and end routine progress updates with the footer line once a
      milestone is confirmed. Docs-only change; PitWay still cannot verify a
      driver session follows it (M013's standing disclosure) -- the point is
      making the rule explicit and installed rather than session-local memory."
    status: pending
    source:
      milestone: M024
      task: null
    created_at: 2026-08-22T07:22:11.724Z
    resolved_at: null
    promoted_to: null
    archived_reason: null
