  - id: T002
    objective: >-
      Add a new small Git-layer module, `src/git/branch.ts`, alongside the
      existing `src/git/safety.ts`/`exec.ts`/`commit.ts`: `currentBranch(cwd):
      string` (`git rev-parse --abbrev-ref HEAD`), `branchExists(cwd, name):
      boolean` (`git show-ref --verify --quiet refs/heads/<name>`, checked via
      exit code, never string-matching output), and
      `createAndCheckoutBranch(cwd, name): void` (`git checkout -b <name>`) --
      each a thin, single-purpose wrapper in the same style as this project's
      existing Git-layer functions, zero State-layer imports.

      Wire branch creation into `milestone-confirm`'s `runConfirm`
      (`src/core/milestones/confirm.ts`) as exactly two cases, mirroring AC002's
      own two-case split -- confirm performs at most one branch mutation total,
      and only in the first case:

      **Case 1 (fresh confirm, `status === 'draft'`)**: when
      `resolveBranchStrategy` (T001) resolves to `milestone`, after
      `assertNoUnexpectedDirtyPaths` has already passed and before the
      hash/frontmatter write, compute the deterministic branch name
      `pitway/<milestoneId>-<slugifyTitle(title)>` (reusing the existing
      `slugifyTitle` export from `src/state/store.ts` -- do not write a second
      slug implementation) and check `branchExists(root, name)` first. If it
      already exists -- for any reason, a genuine unrelated collision or a
      leftover branch from an earlier crashed confirm attempt alike, with no
      attempt made to distinguish the two -- refuse immediately with a
      diagnostic naming the branch, before any other mutation; never delete,
      reset, or force-create over it. Otherwise: read `currentBranch(root)` as
      the `base_branch` value and its current SHA (`git rev-parse HEAD`, or add
      a small exported helper if none already exists at the right layer) as
      `base_revision`, call `createAndCheckoutBranch`, then persist
      `base_branch`/`base_revision` in the same frontmatter object the existing
      code already builds (`updated.frontmatter`) before `saveContract` -- both
      fields added to `contractFrontmatterSchema` (`src/state/schemas.ts`) as
      additive-optional nullable strings, null on every historical contract.
      Under `main` strategy this whole block is skipped entirely: no branch call
      of any kind, `base_branch`/`base_revision` stay `null`, byte-identical
      existing behavior. (Disclosed, narrow, non-bootstrap gap: a crash between
      `createAndCheckoutBranch` and `saveContract` leaves `status` still `draft`
      with an orphaned branch and no recorded owner -- the next confirm attempt
      re-enters this same Case 1 and correctly refuses on the now-existing
      branch name, requiring manual developer cleanup before retrying; this is
      intentional, not a bug to route around.)

      **Case 2 (resumed confirm, `status === 'in_progress'`, `base_branch`/
      `base_revision` already recorded, no baseline commit found yet -- the
      existing AC012 resume shape)**: under `milestone` strategy, perform no
      branch mutation of any kind. Compute the same deterministic expected
      branch name and compare it against `currentBranch(root)`. If they match,
      proceed directly to the existing (unchanged) baseline-commit-recreation
      call. If they do not match -- including the case where the expected branch
      does not exist at all (`branchExists` returns false) -- refuse with a
      diagnostic naming both the expected and the actually-checked-out branch;
      never check out anything to fix the mismatch. Under `main` strategy this
      whole block is skipped entirely, unchanged from today.

      Add unit tests for the three new `src/git/branch.ts` functions against a
      real temp git repo (not mocked), and integration tests (extending
      `tests/integration/milestone-confirm.test.ts`) covering: fresh confirm
      under `milestone` strategy creates the expected branch name and records
      correct `base_branch`/`base_revision`; a `main`-strategy confirm leaves
      both null and creates no branch (regression); a fresh confirm refuses when
      the deterministic branch name already exists (both a genuine pre-existing
      unrelated branch and a simulated orphaned-from-crash branch, proving both
      refuse identically); a resumed confirm on the correct milestone branch
      completes the baseline commit; a resumed confirm on the wrong branch
      refuses without checking out; and a resumed confirm whose expected branch
      was deleted between attempts refuses rather than recreating it.
    status: completed
    depends_on:
