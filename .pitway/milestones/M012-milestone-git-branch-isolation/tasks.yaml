  - id: T005
    objective: >-
      Add an additive-optional range-scoping parameter to `resolveCommitSha`
      (`src/git/trailers.ts`), e.g. a `since?: string` field on `TrailerQuery`,
      or a separate optional argument -- read the existing function signature
      and its one implementation of the underlying `git log` call first and
      choose whichever shape fits with the least disruption to existing call
      sites. When provided, the underlying `git log` invocation is scoped to
      `<since>..HEAD` instead of the current full-history scan. If the bounded
      call fails at git's own level (an unresolvable/unreachable revision --
      verified with a real test that first hard-deletes the reachability of a
      commit, e.g. via a repo state where the recorded SHA no longer exists in
      history, not merely a made-up string), do NOT fall back to an unbounded
      scan -- throw a `GitError` naming the unreachable `since` value
      explicitly, so an invalid range surfaces as a loud, actionable diagnostic
      rather than silently and possibly incorrectly widening the search (a
      silent unbounded fallback would defeat the branch-isolation guarantee the
      range exists to provide -- see AC005's own reasoning). This is distinct
      from, and must not be confused with, a *valid* range that legitimately
      contains no matching commit -- that case is unchanged and still returns
      `undefined`, exactly as `resolveCommitSha` already does today for "no
      match found." Update every call site that has a milestone's contract in
      scope (the baseline-commit lookup in `src/git/baseline.ts`'s
      `createBaselineCommit`, and any task/ verification-repair commit lookup
      that already calls `resolveCommitSha` with a milestone in scope -- find
      each real call site via a grep, do not assume the list) to pass the
      milestone's `base_revision` when it is non-null, and to omit it otherwise
      -- preserving today's unbounded scan exactly for every `main`-strategy
      milestone and every milestone confirmed before this ships.
      `resolveChangeCommitSha` in the same file is explicitly NOT touched --
      quick-change stays milestone-less and unbounded, by design, since it has
      no milestone contract to source a `base_revision` from.

      Add unit tests: a bounded lookup finds the right commit when the range
      genuinely contains it; a bounded lookup correctly returns `undefined` when
      the target commit exists but falls outside the given range (proving the
      bound is real, not a no-op); the graceful-fallback case for an unreachable
      `since` value; and a regression test proving every call site with no
      `base_revision` available still performs today's unbounded scan unchanged.
    status: completed
