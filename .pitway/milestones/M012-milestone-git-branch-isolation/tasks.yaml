    objective: "Add an additive-optional nested `git` field to `configSchema`
      (`src/state/schemas.ts`): `git: z.strictObject({ branch_strategy:
      z.enum(['main', 'milestone']) }).optional()`. Export the resolved strategy
      as a small pure helper, e.g. `resolveBranchStrategy(config: PitwayConfig):
      'main' | 'milestone'`, returning `'main'` when `git` is absent -- every
      later task that needs to know the active strategy calls this one helper
      rather than re-deriving the absent-means-main fallback independently.
      `loadConfig`/`saveConfig` keep their existing signatures and behavior;
      only the schema shape changes. Add a focused unit test proving a bare,
      pre-existing `{schema_version: 1}` config.yaml (no `git` key at all -- the
      exact shape every one of PitWay's own eleven completed milestones'
      config.yaml already has) still loads successfully and
      `resolveBranchStrategy` returns `'main'` for it, and a second test proving
      `git: {branch_strategy: milestone}` round-trips through save/load
