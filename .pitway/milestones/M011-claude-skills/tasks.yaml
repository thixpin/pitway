  - id: T002
    objective: >-
      Correct pitway init's own asset-installation semantics: replace the
      existing coarse probeClaudeAssets ('ok' | 'missing' | 'invalid', which
      refuses on any partial mix of the managed asset set with no per-file
      detail) with a per-file, content-comparing classification. Remove
      probeClaudeAssets and the ClaudeAssetsProbe type entirely -- do not keep
      them alongside the new mechanism.

      New export in src/state/claude-assets.ts: classifyClaudeAssets(root:
      string): ClaudeAssetClassification[] (a new exported type, {asset: string,
      status: 'absent' | 'identical' | 'conflict'}). For every asset
      listClaudeAssets() already discovers (every command doc, protocol
      document, and -- via the same pre-existing glob, zero special-casing --
      T001's vendored skills and NOTICE.md), compares <root>/.claude/<asset>
      against the shipped source: absent when the destination does not exist;
      identical when it exists and its bytes exactly equal the shipped source (a
      real Buffer.equals content comparison, never mtime/size); conflict when it
      exists with different bytes.

      src/cli/commands/init.ts's runInit is restructured around this
      classification, computed up front (alongside the existing config/state
      probes) before any write occurs anywhere: if classifyClaudeAssets(root)
      contains one or more 'conflict' entries, the whole command refuses, naming
      every conflicting `.claude/<asset>` path in one message (not just the
      first), and writes absolutely nothing -- not config.yaml, not state.yaml,
      not any `.claude/` asset, not T004's root discovery files. When there are
      zero conflicts: installClaudeAssets gains an optional second parameter,
      assets: string[] = listClaudeAssets() (its existing zero-argument shape
      keeps writing everything, additive not breaking, since init.ts is the only
      caller today), and init.ts calls it with exactly the classified-'absent'
      subset -- an 'identical' asset is never rewritten, not even with equal
      bytes, a real behavioral guarantee rather than a
      harmless-because-equal-bytes coincidence. A call where every asset is
      already 'identical' passes an empty list (or skips the call entirely),
      performing zero filesystem writes under .claude/ at all. `--no-claude`
      skips classifyClaudeAssets and every .claude/ read entirely -- `.claude/`
      is never inspected, and the directory is never created if it did not
      already exist.

      Nothing in this task (or anywhere else in this milestone) ever reads or
      writes a path under the developer's home directory -- every call takes an
      explicit root and operates only under `<root>/.claude/`.

      New tests/unit/claude-assets.test.ts: focused unit tests for
      classifyClaudeAssets against a real temp directory tree (not a full pitway
      init) -- covering absent/identical/conflict for a representative asset.
      New tests/unit/no-global-claude-access.test.ts: a structural test
      (grep/AST-based, proven able to fail against a deliberately-reintroduced
      reference) asserting neither src/state/claude-assets.ts nor
      src/cli/commands/init.ts references os.homedir, process.env.HOME, or
      process.env.USERPROFILE anywhere -- later tasks extend this same file for
      their own new modules once they exist.

      tests/integration/init.test.ts gains: a fresh default install (nothing
      present) installs every asset including T001's skills; an identical rerun
      performs zero .claude/ writes and reports success; a mixed rerun (some
      assets already identical, at least one genuinely absent, zero conflicts)
      installs only the absent ones and asserts the already-identical files'
      bytes/mtimes are untouched -- the direct regression test for
      installClaudeAssets's new subset parameter; a single conflicting command
      doc (an existing .claude/commands/<name>.md with different content,
      simulated before calling init) refuses, naming exactly that path; a single
      conflicting skill (.claude/skills/<name>/SKILL.md with different content)
      refuses the same way; two simultaneous conflicts (one command doc, one
      skill) refuse naming both together, not just one; a conflict alongside
      otherwise- absent assets writes nothing at all, verified by asserting no
      file was created anywhere under .pitway/ or .claude/ after the refusal;
      and --no-claude leaves .claude/ completely untouched (the directory is not
      even created). The existing "refuses a partial .claude state and writes
      nothing at all, including .pitway/" test is revised to match the corrected
      semantics: a partial-but-non-conflicting state (some assets absent, none
      differing) is no longer refused -- it installs the missing assets cleanly;
      only an actual content conflict refuses.
