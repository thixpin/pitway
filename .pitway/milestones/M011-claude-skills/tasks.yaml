  - id: T004
    objective: >-
      New root agent-discovery files: pitway init makes PitWay usage immediately
      discoverable to any agent opening the initialized project, via two new,
      minimal, non-destructive root files -- AGENTS.md (generic, no
      Claude-specific wording) and CLAUDE.md (Claude-specific entry point).

      New src/state/root-instructions.ts (State layer, no Core involvement --
      purely static content materialization with byte-comparison idempotency,
      the same shape T002's classifyClaudeAssets already established). One
      shared list of bullet lines is the single source of truth, never
      duplicated independently between the two files' content constants, stating
      exactly and only: this project uses PitWay; run `pitway resume` before
      starting or resuming any work; never edit `.pitway/` directly; work only
      within a confirmed task boundary; obtain a task's bounded context via
      `pitway task-status <id> --context`. CLAUDE.md's own framing additionally
      points to AGENTS.md and to `.claude/protocol-driver.md` (never restating
      the driver protocol itself). Neither file ever contains contract text,
      milestone history, IMPLEMENTATION_PLAN.md content, or other verbose
      protocol prose; both stay a handful of lines.

      export classifyRootInstructionFiles(root: string, opts?:
      {includeClaudeMd?: boolean}): RootInstructionClassification[] (default
      {includeClaudeMd: true}; RootInstructionClassification = {file:
      'AGENTS.md' | 'CLAUDE.md', status: 'absent' | 'identical' | 'conflict'}),
      the read-only classifier -- mirrors T002's classifyClaudeAssets exactly in
      shape and semantics. When includeClaudeMd is false, CLAUDE.md is never
      stat'd or read at all and is omitted from the returned array entirely (not
      merely marked absent), preserving --no-claude's "never inspected"
      guarantee. This is a genuine exported deliverable, not a private
      implementation detail -- T005 imports and reuses it directly.

      export applyRootInstructionFiles(root: string, opts: {includeClaudeMd:
      boolean}): {agentsMd: 'created'|'identical'|'preserved', claudeMd?:
      'created'|'identical'|'preserved'} is built directly on top of
      classifyRootInstructionFiles (calls it, then acts): absent -> write the
      fixed content, report 'created'; identical -> report 'identical', no
      write; conflict -> never write or append, report 'preserved'.

      src/cli/commands/init.ts wires this in: called from inside runInit's
      finish() path (i.e. strictly after T002's .claude/ conflict preflight has
      already passed or been skipped via --no-claude -- never before it, so a
      refused Claude-asset installation never leaves a partial instruction setup
      behind), with includeClaudeMd set to the same installClaude flag
      --no-claude controls. When either file's outcome is 'preserved', the CLI
      prints a concise warning containing the exact fixed content that would
      have been written -- the literal string constant itself, not a paraphrase
      -- so a developer can merge it in by hand.

      Baseline git-safety integration, delivered for real: pitway init never
      commits anything itself -- AGENTS.md/CLAUDE.md sit untracked exactly like
      freshly installed .claude/ assets already do, until the first
      milestone-confirm sweeps everything PitWay-managed into its baseline
      commit. src/core/milestones/confirm.ts's computeExpectedBaselinePaths call
      is extended with classifyRootInstructionFiles(root).filter(c => c.status
      !== 'conflict').map(c => c.file), added to the existing
      listClaudeAssetDestinations() as extraExpectedPaths -- a root file
      classified 'conflict' is therefore never included, never silently staged
      merely because its path is known; if it happens to be genuinely dirty at
      that moment it correctly becomes unexpected dirt and refuses confirmation,
      the same treatment .claude/ conflicts already get. In the realistic case
      this task's own tests construct -- a developer's pre-existing AGENTS.md/
      CLAUDE.md already tracked and committed before ever running pitway init --
      the file is simply clean and never enters the dirty-path question at all:
      milestone-confirm proceeds normally and the file is never staged into
      PitWay's own baseline commit. Without this baseline wiring, every one of
      this project's own dozens of existing integration tests that run a real
      init followed by a real milestone-confirm (and every real developer repo)
      would break: an untracked, freshly-created AGENTS.md would become
      unexpected dirt the very first time milestone-confirm runs. task-verify's
      dirty-path allowance and completeTask's expectedPaths need no update --
      both operate only after this first baseline commit already exists.

      This task does not yet make .claude/ assets themselves content-aware at
      confirm time (today's listClaudeAssetDestinations() call stays as-is here
      -- a pre-existing gap since M006, not introduced or widened by this task's
      own two new root paths, which are content-aware from the start), and does
      not touch quick-change/create.ts at all -- T005 closes both of those with
      one shared mechanism built on top of this task's own exported
      classifyRootInstructionFiles.

      Test coverage in tests/integration/init.test.ts: both root files absent
      creates both; an identical rerun performs zero writes to either; an
      existing, user-authored AGENTS.md is preserved byte-for-byte with a
      warning printed containing the exact fixed content; an existing,
      user-authored CLAUDE.md is preserved the same way; a simulated .claude/
      conflict (per T002) alongside two otherwise-absent root files causes the
      whole init to refuse with neither root file created, proving the preflight
      ordering; --no-claude creates/preserves AGENTS.md only, never touching
      CLAUDE.md or .claude/. New tests/unit/root-instructions.test.ts: focused
      unit tests for classifyRootInstructionFiles and applyRootInstructionFiles
      against a real temp directory (absent/identical/conflict for each file,
      includeClaudeMd true and false, confirming CLAUDE.md is never read at all
      when false). Extends T002's tests/unit/no-global-claude-access.test.ts to
      also assert src/state/root-instructions.ts contains no
      os.homedir/process.env.HOME/process.env.USERPROFILE reference. Extends
      tests/integration/self-hosting-readiness.test.ts's existing real init ->
      milestone-add -> milestone-confirm coverage with two real full-lifecycle
      tests: (a) both root files are untracked immediately after init,
      milestone-confirm succeeds without refusing, both root files appear in the
      resulting baseline commit's file list, and git status --porcelain is empty
      immediately afterward; (b) a pre-existing, already-committed AGENTS.md
      with different content is left completely untouched by init
      (byte-identical to its original content afterward), milestone-confirm
      still succeeds (the file was never dirty), and the baseline commit's file
      list does NOT include AGENTS.md -- the direct regression proof that a
      preserved file is never staged merely because its path is known. Updates
      tests/integration/milestone-confirm.test.ts's own
      expected-baseline-file-list fixtures (already built from
      listClaudeAssetDestinations()) to also include the currently-identical/
      absent root paths, and adds one new test confirming milestone-confirm
      succeeds cleanly with both root instruction files present and untracked.
