  - id: T003
    objective: >-
      required_skills schema field + a pre-dispatch context gate, layered
      strictly across CLI/Core/State. taskSchema (src/state/schemas.ts,
      strictObject) gains a new additive-optional field, required_skills:
      z.array(<kebab-case skill-name schema>).max(2).optional(), validated with
      a superRefine (or inline .refine) enforcing: every entry valid non-empty
      kebab-case, at most two entries, no duplicate names within one task's own
      list -- each violation refused at schema-validation time with a message
      naming the specific violation (not a generic "invalid required_skills").
      Absent and present-but-empty are both treated as "no skill requirement"
      everywhere downstream. This field participates in no way in the existing
      relevant_files/context_files/write_scope superRefine -- fully independent,
      no interaction.

      buildTaskContextBundle (src/core/tasks/context-bundle.ts) gains exactly
      one new passthrough field on TaskContextBundle, requiredSkills?: string[]
      (task.required_skills verbatim), mirroring writeScope/contextFiles'
      existing passthrough pattern -- the function stays pure, no filesystem
      access added to it.

      New src/core/tasks/skills.ts is pure, nothing else: export
      assertRequiredSkillsAvailable(requiredNames: string[], availableNames:
      string[]): void. No root parameter, no node:fs import, no .claude/
      knowledge anywhere in this file -- it only compares two plain string
      arrays, throwing a new RequiredSkillsError naming every entry of
      requiredNames absent from availableNames (not just the first) when any
      exist; a complete no-op when requiredNames is empty.

      src/state/claude-assets.ts (not src/core/tasks/skills.ts) owns discovery
      of what is actually installed: a new export, listInstalledSkillNames(root:
      string): string[], sitting alongside this file's existing root-taking
      reads (including T002's own new classifyClaudeAssets) -- lists every
      immediate subdirectory name under <root>/.claude/skills/ that itself
      contains a SKILL.md file, sorted, an empty array when .claude/skills/ does
      not exist. This is the only place in the codebase that reads
      .claude/skills/ from disk for this purpose.

      src/cli/commands/task-status.ts's --context branch orchestrates, owning no
      validation logic of its own: calls listInstalledSkillNames(root) (State),
      then assertRequiredSkillsAvailable(task.required_skills ?? [], available)
      (Core), before building/returning the bundle -- on a thrown
      RequiredSkillsError, the whole command exits non-zero and writes nothing,
      exactly like every other Core-validated refusal in this codebase; when the
      task has no required_skills, this whole sequence is a complete no-op,
      byte-for-byte matching every pre-M011 task's behavior. This is a
      pre-dispatch context gate, distinct from T002's own installation-time
      conflict refusal (a different mechanism, different trigger, different
      file): it proves only that PitWay's own managed
      .claude/skills/<name>/SKILL.md installation is present, never that a
      dispatching harness outside PitWay's control actually loads it -- the same
      disclosed limitation IMPLEMENTATION_PLAN.md section 8 already states for
      worker read-boundary enforcement generally.

      Test coverage beyond ordinary schema round-tripping: a task with 0/1/2
      valid required_skills round-trips through schema validation unchanged; 3+
      entries refused; a non-kebab-case entry refused; a duplicate entry
      refused; buildTaskContextBundle passes requiredSkills through verbatim and
      omits it (undefined, not an empty array) when the task has none, matching
      writeScope/contextFiles' existing omission convention;
      assertRequiredSkillsAvailable itself is unit-tested directly against plain
      arrays (no fixtures, no filesystem) for the 0/1/2-missing and no-op cases;
      listInstalledSkillNames is unit-tested against a real temp directory tree
      (a focused test, not routed through a full pitway init) covering: no
      .claude/skills/ at all, an empty one, one skill present, a directory
      present without its own SKILL.md (must not be listed); a task-status
      --context call for a task with all required skills installed succeeds
      unchanged; a call naming one missing skill refuses, naming it; a call
      naming two missing skills refuses, naming both, not just the first; a task
      with no required_skills at all is a complete no-op through this whole
      path, proven by a regression test against pre-existing task-status
      --context behavior.
