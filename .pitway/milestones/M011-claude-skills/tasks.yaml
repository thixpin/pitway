  - id: T005
    objective: >-
      Integration hardening: close two real, related Git-safety gaps for good --
      quick-change create's clean-tree check, and .claude/ asset content-
      awareness at milestone-confirm's own baseline-staging time (T004 already
      made root-instruction-file staging content-aware; this task extends the
      identical treatment to .claude/ assets, closing a gap that has existed for
      .claude/ assets alone since M006, unrelated to and not introduced by this
      milestone).

      New src/state/managed-init-paths.ts: export listSafeManagedDirtyPaths(
      root: string): string[] -- a State-layer function composing T002's
      classifyClaudeAssets(root) and T004's classifyRootInstructionFiles(root),
      never duplicating either one's comparison logic. Filters OUT every entry
      classified 'conflict' from both (an 'absent' entry is harmless to include
      -- never actually dirty, so its presence in an expected-paths ceiling
      changes nothing), unions in the two literal repository-relative paths
      '.pitway/config.yaml' and '.pitway/state.yaml' unconditionally (no content
      check of their own -- mirroring src/git/baseline.ts's own hardcoded
      treatment of these identical two paths; they are PitWay's own state,
      written only by PitWay's own commands, dirty only in the window between a
      fresh init and that repository's first-ever commit), and returns the
      combined real repository-relative destination paths (.claude/<asset> for
      Claude assets, the bare filename for root instruction files, plus the two
      .pitway/* paths). A path currently in 'conflict' state -- tampered
      .claude/ asset or different-content root file alike -- is therefore never
      treated as safe dirt by either consumer below.

      quick-change after init: src/core/quick-change/create.ts's
      assertCleanWorkingTree (today: refuses unconditionally on any dirty path
      at all, no allowance mechanism whatsoever) is rewritten to mirror the
      existing assertNoUnexpectedDirtyPaths pattern already duplicated
      identically in src/core/milestones/confirm.ts and
      src/core/milestones/complete.ts (this small, established, per-caller
      6-line filter-and-throw duplication is followed as-is, not re-abstracted
