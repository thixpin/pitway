tasks:
  - id: T001
    objective: >-
      Vendor six Claude Code skills verbatim from
      github.com/thixpin/claude-config at pinned commit
      d498eae219441839f75f737643857f6c0f84df12 (already cloned and reviewed
      firsthand this session -- content is copied byte-for-byte from that
      reviewed clone, never re-fetched or re-typed, to eliminate any risk of
      accidental paraphrase): debugging, bug-fix, testing, code-quality-review,
      architecture-review, security-audit, each landing unmodified at
      src/integrations/claude/skills/<name>/SKILL.md (frontmatter and body both
      byte-for-byte identical to the pinned commit -- no attribution text added
      inside any vendored file). infra-design and terraform-review are not
      vendored (no PitWay infrastructure/IaC domain -- explicitly evaluated and
      rejected, not silently skipped). claude-config's own commands/ directory
      is not vendored at all, wholesale or partially -- do not create anything
      under src/integrations/claude/commands/ beyond PitWay's own eighteen
      existing command docs, which stay completely untouched by this task.

      One new file, src/integrations/claude/skills/NOTICE.md, records: the
      source repository URL, the pinned commit SHA, the MIT license identifier,
      and the copyright notice exactly as it appears in the pinned commit's own
      LICENSE file -- whatever holder name and year that file actually states,
      copied verbatim, not assumed or guessed at drafting time -- plus the
      reuse-unchanged classification for all six vendored skills and the
      explicit infra-design/terraform-review rejection with its reason. This is
      the one and only place attribution lives.

      A new test (extend tests/integration/init.test.ts's existing "pitway init
      Claude Code asset installation" describe block, or an adjacent new
      describe block in the same file) proves, via a real pitway init in a fresh
      temp repo (not assumed from listClaudeAssets()'s existing generic coverage
      alone), that all six skills install to exactly
      .claude/skills/<name>/SKILL.md and NOTICE.md installs to
      .claude/skills/NOTICE.md. This task does not touch
      src/state/claude-assets.ts or src/cli/commands/init.ts at all -- it only
      adds new source assets for the existing glob-based installer to discover;
      T002 is where init's own installation mechanism itself changes.
