  - id: T010
    name: Automatic non-blocking issue capture rule in protocol (developer-directed)
    objective: "Install the issue-reporting discipline in the protocol text: when an
      agent discovers an unrelated, non-blocking issue mid-task, it surfaces it
      immediately -- naming the discovering task -- so it is captured as a
      backlog item through the existing PitWay workflow/host mechanism, instead
      of expanding the current task's scope. Agents do not edit .pitway/ state
      directly and are not required to invoke pitway CLI commands themselves;
      reporting is the agent's job, capture belongs to the driver/host. Blocking
      or task-related issues keep following the normal escalation/scope rules
      (task-amend / contract amendment with developer approval). Land the rule
      in protocol-worker.md (and coordination.md or dispatch.md if they are the
      better home for the discovery moment) across the installed driver assets,
      pinned by asset structure tests. Docs-only."
    status: waiting
    depends_on:
      - T003
    acceptance_criteria:
      - protocol-worker.md (and any better-placed sibling) instructs agents to
        immediately surface unrelated non-blocking findings for backlog capture
        through the existing PitWay workflow -- no direct .pitway/ edits, no
        mandatory agent pitway invocations
      - blocking/task-related issues explicitly keep the escalation/scope rules
      - asset structure tests pin the rule's presence in installed assets
      - docs-only change; no runtime code touched
    write_scope:
      - src/integrations/common/protocol-worker.md
      - src/integrations/common/coordination.md
      - src/integrations/common/dispatch.md
      - tests/unit/claude-assets.test.ts
