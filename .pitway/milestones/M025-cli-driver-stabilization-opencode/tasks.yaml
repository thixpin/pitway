    acceptance_criteria:
      - --milestone <id> and --task <id> filter over recorded source fields
      - "deterministic refusal rule: malformed values refuse by name naming the
        valid shapes (e.g. --status bogus); well-formed but nonexistent ids
        (e.g. --milestone M999) are valid queries yielding a clean empty result,
        with active filters echoed in the human output header"
      - filters combine with --status and with each other; JSON output unchanged
        in shape
      - the command remains read-only (no journal/backlog writes)
    write_scope:
