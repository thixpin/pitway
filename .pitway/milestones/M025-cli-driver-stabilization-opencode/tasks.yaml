      item.source.task). Filters combine with each other and with --json;
      unknown or malformed filter values refuse by name; the command stays
      read-only. Behavioral tests cover each filter alone, combined (including a
      no-match empty result), and refusal diagnostics."
    status: ready
    depends_on:
