schema_version: 1
tasks:
  - id: T001
    name: Racing footer on every CLI progress surface (B016 + B010 audit residue)
    objective: "Audit every human-render CLI surface that reports milestone progress
      (task-update completion output, task-dispatch, task-integrate,
      task-discard, milestone-complete, milestone-cancel, milestone-merge,
      backlog transitions, resume) against protocol-driver.md's Progress
      reporting rule and M013's computeRacingFooter. Wire the footer into every
      surface found missing -- task-update's completion output is the known gap
      (B016: footer immediately below the completion message) -- and pin each
      wired surface with a focused test in
      tests/integration/racing-footer-surfaces.test.ts plus
      tests/unit/footer.test.ts coverage for any new footer composition.
      Surfaces already rendering the footer stay byte-stable; record the audit
      table (surface -> before/after) in completion evidence."
    status: completed
    depends_on: []
    acceptance_criteria:
      - task-update's completion output renders the racing footer immediately
        below the completion message (B016)
      - every CLI human-render surface reporting milestone progress either
        already rendered the footer or renders it now, with a test pinning it;
        the audit result is recorded surface-by-surface
      - no surface's existing output changes beyond the added footer line
    write_scope:
      - src/cli/commands/task-update.ts
      - src/cli/commands/task-dispatch.ts
      - src/cli/commands/task-integrate.ts
      - src/cli/commands/task-discard.ts
      - src/cli/commands/milestone-complete.ts
      - src/cli/commands/milestone-cancel.ts
      - src/cli/commands/milestone-merge.ts
      - src/cli/commands/backlog.ts
      - src/cli/commands/resume.ts
      - src/core/milestones/footer.ts
      - tests/unit/footer.test.ts
      - tests/integration/racing-footer-surfaces.test.ts
      - tests/integration/task-update.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/unit/footer.test.ts
        tests/integration/racing-footer-surfaces.test.ts
        tests/integration/task-update.test.ts
    result:
      summary: "[truncated]  on all CLI progress surfaces — helper
        getFooterForActiveMilestone added, 8 surfaces now emit footer in human
        mode (task-update, dispatch, integrate, discard,
        milestone-complete/cancel/merge, backlog add/promote/archive);
        resume/milestone-status byte-stable already. Audit table recorded."
