  - id: T004
    name: Codify driver report style in protocol text (B011)
    objective: "Strengthen the installed protocol text so verbatim relay is a rule,
      not a habit: protocol-driver.md's Progress reporting section (plus
      report-format.md if it is the better home for the rendering half) must
      explicitly require (1) reproducing milestone-status/resume rendered tables
      and the racing footer as-is when relaying to the developer -- annotations
      may surround them, prose summaries may not replace them -- and (2) ending
      routine progress updates with the footer line once a milestone is
      confirmed (B011). Apply the same instruction to the claude copies of
      commands/milestone-status.md and commands/ms-status.md (the opencode
      copies belong to T005). Docs-only; extend the asset structure tests to pin
      the rule's presence."
    status: waiting
    depends_on:
      - T003
      - T010
    acceptance_criteria:
      - protocol-driver.md mandates verbatim table+footer relay and the
        routine-update footer closing line
      - the claude milestone-status.md and ms-status.md carry the same rule
        alongside their --report/--json guidance
      - the claude milestone-status.md and ms-status.md gain direct usage-block
        invocation examples per AC003 (this task owns them for B014)
      - asset structure tests assert the rule text's presence in each file
      - docs-only change; no runtime code touched
    write_scope:
      - src/integrations/common/protocol-driver.md
