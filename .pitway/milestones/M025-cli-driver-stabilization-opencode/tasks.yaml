  - id: T002
    name: Reusable CLI table renderer + milestone-status refactor (B012)
    objective: Add one reusable terminal table renderer (consistent column
      alignment, content-aware widths, Unicode-safe, wrapping behavior decided
      and tested -- never mid-grapheme breaks) as its own module with unit
      tests, and refactor milestone-status's tables to render through it (B012).
      The refactored output must be byte-identical to today's tables unless a
      divergence is deliberate, in which case each divergence is an explicit,
      test-pinned decision recorded in evidence. No other command's output
      changes.
    status: completed
    depends_on: []
    acceptance_criteria:
      - the renderer module carries unit tests covering alignment, width
        computation (including wide/Unicode characters), and edge cases (empty
        cells, varying row lengths)
      - milestone-status's default and --report tables render through it with
        byte-identical output to the pre-refactor renderings, or each deliberate
        divergence is named and test-pinned
      - no other command's rendered output changes
    write_scope:
      - src/cli/table.ts
      - src/cli/format.ts
      - src/cli/commands/milestone-status.ts
      - tests/unit/table-renderer.test.ts
      - tests/integration/milestone-status.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/unit/table-renderer.test.ts
        tests/integration/milestone-status.test.ts
    result:
      summary: T002 table renderer implemented and milestone-status refactored —
        reusable renderer with grapheme-safe width, tests covering alignment,
        Unicode, wrapping; milestone-status tables byte-identical via renderer.
      evidence: Tests  62 passed (62) | Start at  22:23:16 | Duration  4.63s
        (transform 370ms, setup 0ms, import 522ms, tests 4.07s, environment 0ms)
    attempts: 1
    usage: null
