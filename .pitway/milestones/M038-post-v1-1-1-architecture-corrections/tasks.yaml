schema_version: 1
tasks:
  - id: T001
    name: Deduplicate driver command docs into common/commands
    objective: "Move every shared command-doc body to
      src/integrations/common/commands/<name>.md and make codex/opencode resolve
      command docs from common/. BEFORE any edit: run npx vitest run
      tests/unit/claude-assets.test.ts tests/unit/codex-assets.test.ts
      tests/unit/opencode-assets.test.ts
      tests/integration/multi-driver-assets.test.ts
      tests/integration/build-bin.test.ts and confirm green; then snapshot, for
      each driver, resolveDriverAssets(driver) plus the sha256 of
      resolveDriverAssetSource(driver, asset) for every asset, into a scratch
      file -- this is the baseline the post-move result MUST equal byte-for-byte
      (AC002). The move: for each of the 32 docs, plain-filesystem `mv
      src/integrations/codex/commands/<name>.md
      src/integrations/common/commands/<name>.md` (codex and opencode are
      byte-identical, so either is the source of truth; verify with diff -r
      first), then `rm` the opencode copy. Do NOT stage with git mv/git rm:
      completion's dirty-path check is an exact per-path match against unstaged
      git status, which reports a move as a separate deleted path plus an
      untracked path -- both old and new paths are declared in write_scope for
      exactly that reason. Do NOT touch src/integrations/claude/commands/
      content -- those 32 files stay as whole-file overrides (argument-hint
      frontmatter is a real Claude Code UX difference; the lookup is a static
      whole-file override per driver-assets.ts and must not be changed). After
      the move, codex/ and opencode/ directories contain nothing and disappear
      from git; driver-assets.ts's listMarkdownAssets already treats a missing
      directory as empty, but scripts/copy-claude-assets.mjs copies the whole
      tree (fine) and tests/integration/build-bin.test.ts iterates per-tier
      source dirs -- make that test tolerate a tier whose source dir does not
      exist (an absent source dir means nothing to copy, not a failure). Rewrite
      parity tests to pin the NEW invariant, not the old layout: (1)
      tests/unit/codex-assets.test.ts and tests/unit/opencode-assets.test.ts
      currently assert 'commands from <driver>/', '<driver>/ contains only
      commands/*.md', and per-doc 're-wraps its Claude source' -- change these
      to assert the driver dir ships nothing and every command doc resolves to
      common/, and move the re-wrap check (quoted description-only frontmatter,
      description equal to claude's, body byte-identical to claude's) to run
      against common/commands/ instead, keeping the ms-* alias byte-parity check
      against common/; (2) tests/integration/multi-driver-assets.test.ts's
      'command docs come from each driver's own directory' becomes 'claude
      command docs come from claude/ overrides; codex and opencode command docs
      come from common/'; the 'all drivers ship the same command-doc set' and
      stray-override guard should pass as-is (claude overrides now genuinely
      shadow common/ files -- confirm, and if findStrayOverrides needs no change
      leave it alone); (3) tests/unit/claude-assets.test.ts's pinned-sha256
      one-time migration manifest checks claude/common content that this task
      does not edit -- it must pass unmodified; add one new describe asserting
      that for every common/commands/<name>.md a claude/commands/<name>.md
      override exists whose body is byte-identical and whose description
      matches. Finally re-run the pre-move snapshot comparison: resolved asset
      set and per-asset content sha256 for all three drivers must be identical
      to the baseline, and a temp repo initialised with the PRE-move build for
      --opencode/--codex must report zero drift when classified by the POST-move
      code (classifyDriverAssets all 'identical'). Do not reword any doc body;
      do not touch src/state/driver-assets.ts's resolution rule."
    status: completed
    depends_on: []
    acceptance_criteria:
      - src/integrations/common/commands/ holds 32 docs in quoted
        description-only frontmatter form; src/integrations/codex/ and
        src/integrations/opencode/ hold no files.
      - For all three drivers, resolveDriverAssets() and the sha256 of every
        resolved asset's content are identical to the pre-move baseline
        snapshot.
      - Every claude/commands/<name>.md override has a body byte-identical to
        common/commands/<name>.md and a matching description; ms-* aliases in
        common/ are byte-identical to their milestone-* counterparts.
      - codex/opencode asset tests, multi-driver-assets, init, and build-bin
        tests pass with layout-pinning assertions replaced by their successors;
        the claude pinned-sha256 manifest passes unmodified.
      - A repo initialised from the pre-move build reports no drift under the
        post-move classifyDriverAssets for any driver.
