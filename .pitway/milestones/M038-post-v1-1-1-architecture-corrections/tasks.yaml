  - id: T002
    name: Fix state/journal cycle and make git/safety a pure Git layer
    objective: "Two direction fixes, no behavior change. (a) src/state/journal.ts:8
      imports derivePending/resolveTargetPath from
      src/core/journal/operations.ts, which type-imports
      JournalEntry/JournalRecord/etc. back from state/journal.ts -- a
      State<->Core cycle. Move derivePending, buildJournalEntry,
      resolveTargetPath, and JournalValidationError into the State layer: create
      src/state/journal-operations.ts (keeping the existing function bodies and
      comments verbatim, importing types from ./journal.js -- or, if
      journal.ts's own import of them makes that a cycle within State, place
      them directly in journal.ts; choose whichever leaves zero cycles) and
      DELETE src/core/journal/operations.ts rather than leaving a re-export
      shim. Update every importer: src/state/journal.ts, src/git/safety.ts (see
      b), and the tests that import ../../src/core/journal/operations.js
      (backlog-state, journal, git-safety unit tests; usage-add, backlog,
      task-add, task-amend, milestone-complete, milestone-merge,
      milestone-confirm, auto-run, task-update integration tests).
      tests/unit/journal.test.ts:768's 'layering: src/core/journal/ must not
      import node:fs or node:path' test must be re-pointed at the new State
      module (same no-fs/no-path assertion) rather than deleted. (b)
      src/git/safety.ts imports readJournal (state), resolveMilestoneDirName
      (state), and derivePending/resolveTargetPath (core) solely to compute
      journalTargets inside classifyDirtyPaths when options.journalMilestone is
      set. Replace the journalMilestone option with journalTargetPaths?:
      string[] -- already-resolved repo-relative paths, treated exactly like the
      old journalTargets set (expected regardless of
      taskWriteScope/verifiedCleanStart). Add one Core helper, e.g.
      resolvePendingJournalTargets(root, milestoneId): string[] in
      src/core/journal/pending-targets.ts, that performs the old branch
      verbatim: readJournal -> derivePending -> filter by milestone -> if any,
      resolveMilestoneDirName inside the same try/catch (unresolvable directory
      => []) -> map resolveTargetPath. Update all five call sites to pass
      journalTargetPaths: resolvePendingJournalTargets(root, milestoneId):
      src/core/tasks/update.ts (two sites, ~462 and ~680),
      src/core/tasks/verify.ts:237, src/core/tasks/integrate.ts:198,
      src/core/milestones/complete.ts:190. After this, src/git/safety.ts imports
      only from ./exec.js. Update safety.ts's binding-semantics comment block so
      it describes journalTargetPaths and no longer claims the module depends on
      the State layer. Tests: rewrite the journalMilestone cases in
      tests/unit/git-safety.test.ts to pass journalTargetPaths directly (same
      expected/unexpected outcomes, including the root-level backlog.yaml and
      unrelated-milestone cases, which now exercise the Core helper instead);
      add a new unit test file for the Core helper covering: pending entry for
      the milestone -> its target path; pending entry for another milestone ->
      excluded; checkpointed entry -> excluded; backlog_recording ->
      .pitway/backlog.yaml; unresolvable milestone directory -> [] with no
      throw. Add an import-direction test (in tests/unit/journal.test.ts or a
      new tests/unit/layering.test.ts) asserting by source inspection that
      src/state/journal.ts and src/state/journal-operations.ts contain no import
      from ../core/ and src/git/safety.ts contains no import from ../state/ or
      ../core/. TDD: write the direction test first (RED), then move code
      (GREEN)."
    status: completed
    depends_on: []
    acceptance_criteria:
      - src/core/journal/operations.ts no longer exists; derivePending,
        buildJournalEntry, resolveTargetPath, and JournalValidationError are
        exported from the State layer with unchanged behavior, and every
        src/tests importer is updated.
      - src/state/journal.ts has no import from src/core/; src/git/safety.ts
        imports only from ./exec.js.
      - classifyDirtyPaths accepts journalTargetPaths; a single Core helper
        resolves pending journal targets and is used by all five former
        journalMilestone call sites; classification outcomes for every existing
        scenario are unchanged.
      - The git-safety, journal, and backlog-state unit tests pass with the same
        asserted outcomes; a new unit test covers the Core helper; an
        import-direction test guards both boundaries.
      - Human and --json output of task-update, task-verify, task-integrate, and
        milestone-complete is byte-for-byte unchanged.
