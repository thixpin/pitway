  - id: T004
    name: "B008: dedupe init-generated CLAUDE.md vs AGENTS.md"
    objective: "Restructure pitway init's root instruction files around a delimited
      PitWay-managed block, per AC011's five cases (a)-(e), fixing B008's
      duplication and enabling the future pitway update's
      only-modify-PitWay's-portion contract. In src/state/root-instructions.ts:
      (a) dedup -- CLAUDE.md's PitWay content becomes a thin pointer via Claude
      Code's documented @AGENTS.md import bridge
      (docs/evidence/M022/claude-code.md section 4) plus the
      .claude/protocol-driver.md pointer; the 5 SHARED_BULLETS live only in
      AGENTS.md's content. (b) managed block -- each file's PitWay content is
      wrapped in <!-- pitway:managed:start --> / <!-- pitway:managed:end -->
      markers (invisible in rendered markdown), the only region PitWay ever owns
      in these files. (c) append -- when AGENTS.md or CLAUDE.md already exists
      without a managed block and is not a known legacy PitWay-generated form,
      init APPENDS the marked block to the existing file (replacing the former
      preserve-untouched behavior for these two files, explicit developer
      directive 2026-08-22). (d) legacy migration -- a file byte-equal to a
      known prior PitWay-generated form (the pre-B008 full-content constants) is
      rewritten to the new marked form outright, never appended-to. (e)
      present-but-differing managed block -- init leaves the file unmodified and
      reports it (the future update command's job, which stays out of scope).
      Update tests/unit/root-instructions.test.ts with real cases for all five
      behaviors, and tests/integration/init.test.ts where it asserts the old
      content verbatim."
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - CLAUDE.md's managed-block content no longer contains the SHARED_BULLETS
        text -- it imports AGENTS.md via the @AGENTS.md bridge and keeps the
        .claude/protocol-driver.md pointer
      - both files' PitWay content is delimited by the pitway:managed:start/end
        HTML-comment markers
      - a pre-existing user-authored file without a managed block gets the
        marked block APPENDED, its own content untouched above it
      - a file byte-equal to a known legacy PitWay-generated form is rewritten
        to the new marked form outright, never appended-to
      - a file whose managed block exists but differs is left unmodified and
        reported
      - no template engine or general rewrite mechanism is introduced -- plain
        string constants and marker search, exactly in the existing module's
        style
    write_scope:
      - src/state/root-instructions.ts
      - tests/unit/root-instructions.test.ts
      - tests/integration/init.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/unit/root-instructions.test.ts
        tests/integration/init.test.ts
    result:
      summary: B008 delivered with the full managed-block design (AC011 cases a-e) --
        CLAUDE.md dedup via the @AGENTS.md bridge, pitway:managed markers,
        append on user-authored files, legacy migration, differing-block
        preservation.
      evidence: Tests  43 passed (43) | Start at  11:23:38 | Duration  2.20s
        (transform 286ms, setup 0ms, import 393ms, tests 1.77s, environment 0ms)
