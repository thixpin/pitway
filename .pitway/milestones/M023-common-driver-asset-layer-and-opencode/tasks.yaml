  - id: T002
    name: OpenCode driver assets and init support
    objective: "FIRST, before writing any asset: recheck OpenCode's install layout
      and command frontmatter shape against its live upstream docs
      (opencode.ai), and record the recheck outcome (confirmed, or corrected
      with specifics) in completion evidence -- the M022 evidence snapshot is
      the starting point, never the sole authority (pre-confirm architect
      finding: single-sourced circular verification). Then ship
      OpenCode-specific command docs under src/integrations/opencode/commands/
      -- all 32 mirrors (24 canonical + 8 ms-* aliases), one per existing Claude
      Code command doc, re-wrapped in OpenCode's own documented convention (one
      markdown file per command, filename becomes /name) -- content mirrors each
      source command doc's description and pitway-invocation instruction. Skills
      and protocol docs resolve to common/ entirely for OpenCode; do not create
      an OpenCode override for them unless a real, disclosed incompatibility is
      found (name it explicitly in completion evidence if so). Add an opt-in
      OpenCode installation flag to pitway init (additive, Claude stays
      default-on), installing the resolved OpenCode asset set into .opencode/:
      skills at .opencode/skills/<name>/SKILL.md, commands at
      .opencode/commands/<name>.md, and the 7 protocol docs at
      .opencode/<name>.md -- mirroring .claude/'s own root-level protocol doc
      layout (AC006's explicit destination spec, the developer-approved
      recommended option). Extend src/git/baseline.ts's managed-dirty-path
      recognition (currently .claude/-only) to also recognize installed
      .opencode/ managed paths, so milestone-confirm/quick-change create don't
      refuse on a freshly-installed OpenCode asset set. The resolution wiring
      lives in src/state/driver-assets.ts (in scope here too)."
    status: ready
    depends_on:
      - T001
    acceptance_criteria:
      - the live-upstream layout/frontmatter recheck ran first and its outcome
        (confirmed or corrected) is in completion evidence
      - all 32 OpenCode command docs (24 canonical + 8 ms-* aliases) exist, in
        OpenCode's own documented convention, content-equivalent to their Claude
        Code source
      - skills and protocol docs are not overridden for OpenCode unless a real
        incompatibility is disclosed
      - pitway init supports an opt-in OpenCode installation path installing
        skills, commands, and the 7 root-level protocol docs into .opencode/ at
        their AC006-specified destinations
      - milestone-confirm/quick-change create do not refuse on a freshly
        pitway-init --opencode'd repo's own managed .opencode/ paths
