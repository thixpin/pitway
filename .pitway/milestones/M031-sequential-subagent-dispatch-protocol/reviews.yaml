      - role: architect
        recorded_at: 2026-08-24T05:58:09Z
        findings:
          - severity: major
            finding: "AC001(c)/(g) and protocol-worker.md's addendum say a resumed subagent
              treats each new bundle as standalone, carrying forward none of a
              prior task's write scope or context -- but harness \"resume with
              retained context\" by definition keeps the prior task's full turn
              in the model's context window. That's the mechanism being
              exploited to save re-briefing cost. This is in real tension with
              CLAUDE.md's Context isolation rule (\"task subagents receive only
              the generated task-context bundle... never full milestone
              history\"), which AC003 asserts stays unchanged. The (g) honesty
              disclosure frames the risk as \"cannot verify resume retained
              context\" -- the opposite of the actual risk: resume *does* retain
              cross-task context by design, weakening isolation for tasks 2+ in
              a chain. The write-scope check guards writes only, not cross-task
              context/judgment bleed."
            targets:
              - ac001
              - ac003
            recommendation: "Add a Change Log entry (and dispatch.md line) naming this
              trade-off directly: resumed-chain tasks get weaker context
              isolation than a fresh dispatch, bounded only by write-scope. Get
              explicit sign-off."
          - severity: minor
            finding: "AC001 says protocol-driver.md's \"Dispatch discipline\" section gains
              a pointer \"mirroring the existing 'Parallel dispatch'
              cross-reference already there.\" Checked the live file: Dispatch
              discipline (line 129) and Parallel dispatch (line 160) are sibling
              sections with no pointer between them today -- nothing to mirror
              inside Dispatch discipline. The only related pointer runs the
              other way: dispatch.md's own Parallel dispatch subsection links to
              protocol-driver.md's section."
            targets:
              - ac001
              - t001
            recommendation: "Correct the AC/task text before T001 starts: describe the
              actual pattern (dispatch.md-to-protocol-driver.md style pointer)
              so the implementer isn't sent looking for a cross-reference that
              doesn't exist."
        usage: null
