      `pitway resume` view alone yields the protocol's next action for a
      restarted persistent-identity Orchestrator (M040 Decision 2), modelled on
      M041's two real restarts (post-block; mid-task interruption). Read-only
      test; no Core change.
    status: completed
    depends_on: []
    acceptance_criteria:
