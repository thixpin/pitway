schema_version: 1
tasks:
  - id: T001
    name: Durable-state audit for Orchestrator flush
    objective: Write docs/architecture/orchestrator-flush-audit.md enumerating every
      fact an Orchestrator needs to continue or recover a milestone (task
      statuses/attempts, live dispatches, pending journal entries, verification
      results and task-verify evidence, open review sessions, pending human
      decisions, backlog items, milestone branch), each with the durable
      .pitway/ file or journal record kind (read src/state/journal.ts and
      src/state/schemas.ts) and the pitway command that surfaces it (resume,
      milestone-status, task-status, verify --status, backlog list,
      milestone-review report). List any context-only fact as a gap with a
      proposed durable home; fix nothing.
    status: completed
    depends_on: []
    acceptance_criteria:
      - Every fact cites a real durable location and a surfacing command; gaps
        are listed, not fixed.
    context_files:
      - docs/architecture/orchestrator-flush-audit.md
      - docs/architecture/orchestrator-role.md
      - docs/evidence/M041/split-role-dogfood.md
      - src/state/journal.ts
      - src/state/schemas.ts
      - src/core/views/resume.ts
      - src/core/views/milestone-status.ts
    write_scope:
      - docs/architecture/orchestrator-flush-audit.md
    verification:
      strategy: manual
      detail: Read the audit against AC001.
    result:
      summary: "[truncated] ed-but-undecided human decisions have no durable home --
        with the observation that M041 recovered because the Orchestrator set
        the task blocked first, proposed as a protocol rule (T004), while G1/G2
        are proposed as one additive resume amendment for T005 (developer to
        approve or decline)."
      evidence: Rows cite src/state/journal.ts record kinds (entry, checkpoint,
        auto_run, quick_change, task_verify_evidence,
        worktree_dispatch/integrate/discard, milestone_merge, backlog_archive,
        backlog_add_unscoped), src/state/store.ts files, resume/milestone-status
        view fields, and M041 section 4's two real restarts as the reference
        recoveries.
    attempts: 1
    driver: claude-code
    model: claude-fable-5
    usage: null
