        expected), then 43/43 green. Independently re-verified by the driver:
        target command `npm test -- tests/unit/schemas.test.ts` 43/43 green;
        full suite `npm test` 352/352 green; `npm run typecheck` clean; read
        schemas.ts, context-bundle.ts, and the update.ts diff directly — the
        update.ts change is exactly the one disclosed line, nothing else. All
        five real milestones' tasks.yaml (M001-M005, including M005's own
        completed T001/T002 using plain relevant_files) independently confirmed
        to still load via loadTasks."
    attempts: 1
    usage:
      total_tokens: 98541
  - id: T004
    objective: "Checkpoint-model revision with corrected materialization semantics:
      usage-add and milestone-confirm --amend (1) validate input, (2) append a
      journal entry (T001, type usage_recording / contract_amendment), (3)
      immediately and idempotently write the change to the real .pitway/ file —
      not deferred to checkpoint time, so resume/verify/task-status/task-context
      see it right away — and create no commit of their own. milestone-confirm
      --amend gains a supported amendment-input path (validated draft contract
      file or structured field changes) replacing the direct contract.md
      hand-edit it depended on before; validated command writes are the only
      writes ever made to contract.md. Since the change is already materialized
      as an ordinary dirty PitWay-expected file (T002), the checkpoint-creating
      code (task-update's completion path, milestone-complete) needs no
      knowledge of journal payloads — it commits the already-materialized state
      exactly as any other expected-dirty file, and only after that commit
      succeeds does it append the checkpoint marker(s) for whichever pending
      entries the commit covered (possibly more than one). Regardless of whether
      a task was in progress when the entry was recorded. Recovery covers three
      distinct interruption windows: before the authoritative write, after the
      write but before the next checkpoint commit, and after the commit but
      before its marker. Ambiguous journal recovery blocks execution with a
      diagnostic. M004's historical AC008 commits and behavior are unchanged;
      this criterion only becomes usable once this task lands, and is not
      retroactively true of M005's own earlier task-completion commits (AC004)."
    status: completed
    depends_on:
      - T001
      - T002
    acceptance_criteria:
      - usage-add appends a usage_recording journal entry, then immediately and
        idempotently writes usage.yaml — no commit of its own
      - milestone-confirm --amend appends a contract_amendment journal entry,
        then immediately and idempotently writes contract.md via a validated
        draft file or structured field changes as input (never a pre-existing
        hand-edit) — no commit of its own
      - A read immediately after either command (resume / verify / task-status /
        task-context) reflects the amended state, before any checkpoint commit
        exists
      - task-update's completion path and milestone-complete recognize the
        already-materialized files as expected-dirty (via T002) and commit them
        normally, then append the checkpoint marker(s) only after that commit
        succeeds
      - Folding into the next checkpoint never depends on whether a task
        happened to already be in progress when the entry was recorded
      - Recovery is tested for all three interruption windows (before
        authoritative write; after write, before checkpoint commit; after
        commit, before marker)
      - Ambiguous journal recovery blocks execution with a diagnostic rather
        than guessing
      - M001-M004 history and M004's actual AC008 commits are unaffected; no
        historical rewrite
    relevant_files:
