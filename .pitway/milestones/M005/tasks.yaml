        tests/integration/task-update.test.ts
        tests/integration/milestone-complete.test.ts
    result:
      summary: "Executed by a bounded sub-agent from its task-context bundle,
        independently reviewed and corrected by the driver. usage-add
        (src/core/metrics/aggregate.ts) no longer touches git: it validates,
        accumulates, journal-records (type usage_recording, randomUUID
