schema_version: 1
tasks:
  - id: T001
    objective: "Resumable, git-invisible runtime journal at a path resolved through
      the Git module (git rev-parse --git-path pitway/journal.yaml equivalent —
      never hard-coded, works when .git is a linked-worktree file), passed into
      the State layer, which owns the actual read/write. Append-only entries
      carrying at minimum milestone id, operation type (usage_recording |
      contract_amendment | task_amendment), operation identity, target
      identifier where applicable, and validated payload; checkpoint marker
      entries referencing an original entry's identity plus the capturing commit
      SHA — never clearing or deleting prior entries, and a single commit SHA
      may be referenced by multiple markers (tested); a read-pending query
      deriving entries with no matching marker; self-healing crash recovery
      reusing the existing resolveCommitSha/commitOrResume
      commit-identity-lookup pattern when a commit exists but its marker doesn't
      yet; disclosed limitation that journal durability covers only the current
      local repository/worktree. task_transition and verification_result stay
      entirely outside this journal. Layering: filesystem persistence lives in
      src/state/, not src/core/ — Core defines entry validation and
      pending-derivation as pure functions operating on data already loaded
      through the state layer (AC001)."
    status: completed
    depends_on: []
    acceptance_criteria:
      - Journal path is resolved via the Git module (git rev-parse --git-path
        pitway/journal.yaml equivalent), not a hard-coded .git/... string, and
        resolves correctly under a linked worktree (.git as a file)
      - Journal never appears in git status, never committed, never requires its
        own commit; a test explicitly documents/asserts it does not survive .git
        deletion or a fresh clone
      - Every entry carries milestone id, operation type, operation identity,
        target identifier (where applicable), and validated payload
      - Entries are append-only; mark-checkpointed appends a marker, never
        clears or deletes an original entry; a test covers multiple pending
        operations captured by one checkpoint commit SHA (more than one marker
        referencing the same SHA)
      - read-pending derives entries lacking a matching checkpoint marker
        (computed, not stored deletion)
      - Crash recovery after a checkpoint commit but before its marker is
        written self-heals via existing commit-identity lookup rather than
        re-applying or getting stuck
      - task_transition and verification_result are not journal entries; no code
        path writes them there
      - src/core/journal/ contains zero direct node:fs / node:path imports
        (layering verification, same pattern as M004/T005); all persistence goes
        through src/state/journal.ts
    relevant_files:
      - src/git/paths.ts
      - src/state/journal.ts
      - src/core/journal/operations.ts
      - tests/unit/journal.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/journal.test.ts
    result:
      summary: "Executed by a bounded sub-agent from its task-context bundle.
        src/git/paths.ts: resolvePitwayJournalPath(cwd) resolves the journal
        location via `git rev-parse --git-path pitway/journal.yaml`, made
        absolute with path.resolve — correct under linked worktrees since git
        itself resolves the gitdir: indirection. src/state/journal.ts owns
        actual persistence:
        readJournal/appendJournalEntry/appendCheckpointMarker (append-only,
        read-all/push/write-all, mirroring verification-results.yaml's
        convention) plus reconcilePending, the self-healing recovery function —
        checks HEAD carries the right PitWay-Milestone trailer, then for each
        pending entry compares its on-disk target file against `git show
        HEAD:<path>`; on a byte-for-byte match it appends the missing checkpoint
        marker (idempotent). src/core/journal/operations.ts: pure, zero fs/path
        — derivePending (entries with no later checkpoint marker referencing
        their operationId, computed not stored), buildJournalEntry
        (validation-only), resolveTargetPath (maps operation type to its
        .pitway/ target file). src/state/schemas.ts gained a kind-discriminated
        journalRecordSchema (journalEntrySchema:
        milestone/type/operationId/target?/payload; journalCheckpointSchema:
        milestone/entryOperationId/commitSha) whose type enum (usage_recording |
        contract_amendment | task_amendment) is itself the enforcement that
        task_transition/verification_result can never be journal-written. A
        single commit SHA may be referenced by multiple checkpoint markers
        (multi-entry-per-commit, tested)."
      evidence: "Sub-agent confirmed RED first (modules didn't exist, all 15
        assertions failed for the expected reason), then 15/15 green on first
        GREEN attempt. Independently re-verified by the driver: target command
        `npm test -- tests/unit/journal.test.ts` 15/15 green; full suite `npm
        test` 331/331 green; `npm run typecheck` clean; `grep -rn
        \"node:fs\\|node:path\" src/core/journal/` empty (layering clean). Read
        every changed file in full: confirmed the linked-worktree test creates a
        real `git worktree add` and asserts the resolved path lands under
        .git/worktrees/...; the invisibility test asserts empty `git status
        --porcelain` after an append; the self-healing tests simulate a real
        crash window (commit succeeds, marker never written) via
        commitWithTrailers and verify idempotent, non-duplicating recovery, plus
        a dedicated multi-marker same-SHA test (2 entries, 1 commit, 2 markers
        verified); the .git-deletion test documents the durability limitation as
        a natural failure mode rather than inventing new behavior.
        Scope-conflict finding and correction: the sub-agent's first pass (per
        the driver's own dispatch instructions, which incorrectly authorized it)
        added the journal schemas to src/state/schemas.ts — a file outside
        T001's declared relevant_files. The completion checkpoint's dirty-subset
        gate correctly refused (\"unrelated dirty changes present:
        src/state/schemas.ts\"), catching the main-driver's authorization error
        before anything committed. Corrected by relocating the journal-specific
        schemas from schemas.ts into src/state/journal.ts (already in T001's
        relevant_files, self-contained, nothing outside this module depended on
        the schemas being shared), and reverting schemas.ts to its exact
        pre-T001 content via `git checkout --`. Re-verified target
        test/typecheck/full-suite green after the fix; diff now scoped to
        exactly T001's 4 authorized files."
    attempts: 1
    usage:
      total_tokens: 85451
  - id: T002
    objective: "Working-tree dirty-path classification built on a verified clean
      start: a path is expected only if the current in_progress task's write
      scope covers it AND that task began from a confirmed clean tree (the
      existing invariant, unchanged), or the path is a state file tied to a
      pending journal entry (T001) or an ordinary pending
      task_transition/verification_result write. Declaring a path in write_scope
      grants no expectation by itself. Discloses (does not hide) that a worker's
      edit and a concurrent developer edit to the same permitted file are
      indistinguishable (AC002)."
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - Classification never marks a path expected from write_scope declaration
        alone — only after the task's own verified clean-start check has passed
      - A dirty path matching a pending journal entry, or an ordinary pending
        task_transition/verification_result write, is never reported as
        unexpected
      - Existing refusal diagnostics keep naming genuinely unexpected paths only
      - The concurrent-edit-indistinguishability limitation is documented in
        code comments and covered by a test asserting the behavior (not silently
        assumed away)
    relevant_files:
      - src/git/safety.ts
      - src/state/journal.ts
      - tests/unit/git-safety.test.ts
      - tests/unit/journal.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/git-safety.test.ts tests/unit/journal.test.ts
    result:
      summary: "Executed by a bounded sub-agent from its task-context bundle.
        src/git/safety.ts gains classifyDirtyPaths(cwd, options), built on the
        existing checkWorkingTreeClean without modifying its behavior. Given a
        raw dirty-path list, it classifies each path expected or unexpected:
        taskWriteScope contributes to expected only when verifiedCleanStart is
        true (declaration alone grants nothing); pendingTransitionPaths
        (ordinary task_transition/verification_result writes) and
        journalMilestone's pending journal-entry target files (via T001's
        derivePending/ resolveTargetPath, read-only) are always expected
        regardless of write-scope/clean-start; everything else is unexpected.
        Purely additive — not wired into any existing call site
        (assertDirtySubset, assertNoUnexpectedDirtyPaths); that wiring is T004's
        job."
      evidence: "Independently re-verified by the driver: target command `npm test --
        tests/unit/git-safety.test.ts tests/unit/journal.test.ts` 27/27 green;
        full suite `npm test` 339/339 green; `npm run typecheck` clean; read
        src/git/safety.ts in full — confirmed all 4 ACs map to dedicated tests,
        including a genuine concurrent-edit scenario (a write_scope path edited
        under an explicit developer-not-worker framing, verified clean start,
        still classified expected) proving the disclosed limitation by
        demonstration rather than assuming it away; confirmed
        checkWorkingTreeClean itself is untouched (git diff shows only additive
        lines) and no call site outside the 4 permitted files was touched."
    attempts: 1
    usage:
      total_tokens: 61693
  - id: T003
    objective: "tasks.yaml gains additive-optional context_files (declarative-only
      in M005, no runtime read-enforcement) and write_scope (the real enforced
      write/completion boundary) fields with the full five-case combination
      rule: relevant_files only (legacy); write_scope only (unrestricted reads,
      bounded writes); context_files + write_scope (bounded both ways, every
      write_scope path must appear in context_files); context_files alone
      (rejected, incomplete); relevant_files with either new field (rejected,
      ambiguous). Both relevant_files and the new fields become schema-optional
      so a task may declare either style, never both. task-status --context's
      bundle output reflects the new fields (AC003)."
    status: completed
    depends_on: []
    acceptance_criteria:
      - relevant_files only behaves exactly as today (legacy, unchanged)
      - write_scope only allows unrestricted task-relevant reads with
        write_scope as the sole enforced write/completion boundary
      - context_files + write_scope together requires every write_scope path to
        also appear in context_files, rejecting violations by name
      - context_files alone is rejected as incomplete (write boundary undefined)
      - relevant_files together with context_files or write_scope on the same
        task is rejected as ambiguous, naming the conflicting fields
      - context-bundle.ts surfaces context_files/write_scope in its output
        without claiming read enforcement that doesn't exist yet
    relevant_files:
      - src/state/schemas.ts
      - src/core/tasks/context-bundle.ts
      - tests/unit/schemas.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/schemas.test.ts
    result:
      summary: "Executed by a bounded sub-agent from its task-context bundle.
        src/state/schemas.ts: taskSchema's relevant_files is now optional, with
        new optional context_files/write_scope arrays, gated by a superRefine
        implementing the full six-case rule (relevant_files only: legacy;
        write_scope only: unrestricted reads; context_files+write_scope: every
        write_scope path must appear in context_files, missing paths named;
        context_files alone: rejected, incomplete; relevant_files combined with
        either new field: rejected, ambiguous, naming the conflict; all three
        unset: rejected). Diagnostics use zod's ctx.addIssue so formatIssues
        surfaces them normally. src/core/tasks/context-bundle.ts passes
        context_files/write_scope through to the returned bundle as optional
        contextFiles/writeScope, explicitly disclaiming read-enforcement for
        context_files in a comment. src/core/tasks/update.ts required one
