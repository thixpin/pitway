        unchanged message so caller-visible behavior is identical.
        tests/unit/state-store.test.ts gained 8 new unit tests for the four
        moved functions; no existing test in either target file was modified.'
      evidence: "Independently re-verified by the driver (not just the sub-agent's
        self-report): target command `npm test -- tests/unit/state-store.test.ts
        tests/integration/milestone-add.test.ts` 25/25 green (19 state-store
