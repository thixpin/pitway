        paths refuse the whole operation). milestone-status extended with
        aggregate JSON field and human Tokens line (e.g. \"84.2k (2 tasks
        N/A)\"). Command modules orchestration-only."
      evidence: Sub-agent confirmed RED (missing usage-add module; 4 new
        milestone-status aggregation tests failing), then 14/14 task tests green
