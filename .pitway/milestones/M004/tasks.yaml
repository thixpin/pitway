    status: completed
    depends_on: []
    acceptance_criteria:
      - usage-add accumulates attempts and token sums; rejects
        malformed/negative input
      - Each recording commits exactly the milestone's usage.yaml with a
        milestone-only trailer via commitOrResume (resumable; unrelated dirty
        paths refuse the whole operation)
      - milestone-status shows aggregate with explicit N/A surfacing
      - No estimation anywhere; null stays null
    relevant_files:
