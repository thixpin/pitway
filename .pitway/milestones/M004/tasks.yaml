        typecheck` clean; `grep -n \"node:fs\\|node:path\"
        src/core/milestones/create.ts` empty (exit 1); git diff reviewed
        directly and confirmed scoped to exactly src/state/store.ts,
        src/core/milestones/create.ts, and additive-only changes to
        tests/unit/state-store.test.ts."
    attempts: 1
    usage:
