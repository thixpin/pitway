    acceptance_criteria:
      - Refusals name exactly the missing tasks or failing/missing checks
      - Single persisted status write; active_milestone cleared to null
      - Exact commit set is the milestone's four files plus state.yaml
      - Re-entry idempotent/resumes/refuses per completion identity;
        hook-failure, retry, post-commit interruption tested
    relevant_files:
      - src/cli/commands/milestone-complete.ts
      - src/core/milestones/complete.ts
      - tests/integration/milestone-complete.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/integration/milestone-complete.test.ts
    result:
      summary: "Executed by a bounded sub-agent from its task-context bundle.
        src/core/milestones/complete.ts: completeMilestone — gates (in_progress,
        all non-cancelled tasks completed, latest result per check pass) with
        exact-naming diagnostics; single persisted write collapsing
        in_progress->review->completed; clears active_milestone when pointing at
        the milestone; commitOrResume with the four files + state.yaml and
        completion-specific identity (git show contract status). CLI module
