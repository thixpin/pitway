        tests/integration/milestone-add.test.ts
    result:
      summary: 'Executed by a bounded sub-agent from its task-context bundle.
        src/state/store.ts gains four new exports built on the shared pitwayPath
        helper: nextRequirementId (readdir-derived next R### id, moved verbatim
        from create.ts), saveRequirement (mkdir + write of the requirement
        artifact), readInputFile (generic external-file reader raising
        StateStoreError with the same "cannot read <label> file <path>: ..."
