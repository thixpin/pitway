schema_version: 1
tasks:
  - id: T001
    name: Harden the nested-full-suite init flake
    objective: "Diagnose and harden the flake in
      `tests/integration/completed-task-revision-path.test.ts`'s line-121
      `pitway init` assertion (recurred M013/T008, M014 CT010, M015/T011 --
      passes standalone every time, fails only when the full suite runs nested
      inside `task-verify`/`verify` under real system load). Use the `debugging`
      skill to narrow the actual failure mode under load (a real reproduction,
      not guesswork) before deciding the fix. If the root cause is a genuine
      PitWay defect (e.g. a resource-contention or timing issue in `init`'s
      git-work-tree detection or file-system writes under concurrent subprocess
      load), fix it for real in the affected code path. If the cause proves to
      be inherent to spawning many real git subprocesses concurrently under load
      rather than a PitWay defect, apply a disclosed, evidence-backed test-level
      accommodation (never a bare retry-until-green) and document the reasoning
      inline. Either way, prove the fix against a real reproduction of the
      failure condition. QA-caught gap, fixed at drafting: this task's own
      declared verification is deliberately the FULL suite, not just its own
      test file -- a standalone single-file run always passes regardless of
      whether the fix works (that is the flake's own defining symptom), so it
      can never prove anything about this task specifically. Running the full
      suite means `task-verify T001` genuinely nests a full run inside itself,
      reproducing one of the two historically documented trigger contexts for
      real. Anticipated risk, disclosed: the true root cause is unknown at task
      start (that is the point of using the debugging skill first) and may turn
      out to live outside this task's declared write_scope -- if so, the
      standard contract-amendment stop-and-ask path applies, expected PitWay
      behavior, not a sign the contract was wrong."
    status: ready
    depends_on: []
    acceptance_criteria:
      - AC003
    context_files:
      - tests/integration/completed-task-revision-path.test.ts
      - src/cli/commands/init.ts
      - src/git/safety.ts
      - src/git/exec.ts
    write_scope:
