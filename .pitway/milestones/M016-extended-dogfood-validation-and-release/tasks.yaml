    required_skills:
      - debugging
    verification:
      strategy: tdd
      detail: npm test
    result: null
    usage: null
  - id: T002
    name: Fix QuickChangeError identity split and requireQuickChange duplication
    objective: "Fix both remaining M011 dogfood findings plus the related defect
      this milestone's own drafting found: `QuickChangeError` is currently
      declared as two distinct classes -- `create.ts:14` and `run.ts:11` each
      `export class QuickChangeError extends Error {}` -- with `commit.ts`
      importing/re-exporting `run.ts`'s class and `promote.ts` importing
      `create.ts`'s, so an `instanceof QuickChangeError` check written against
      one site's import silently fails to catch an error thrown by the other's
      code path. Unify to exactly one canonical class (in `create.ts`, since
      `run.ts`/`commit.ts` already depend on `create.ts` for
      `deriveQuickChangeState`) and update `run.ts`/`commit.ts` to import it
      instead of redeclaring. Consolidate the byte-identical
      `requireQuickChange` helper -- duplicated in FOUR files (`create.ts:197`,
      `run.ts:35`, `commit.ts:26`, `promote.ts:18`, not just the three the
      original M011 finding named) -- to a single shared implementation in
      `create.ts`, imported by the other three. Zero behavior change: every
      existing quick-change test passes unmodified. Add one new regression test
      in `tests/unit/quick-change-lifecycle.test.ts` proving an error thrown by
      `run.ts`/`commit.ts` code now passes `instanceof` the same class
      `create.ts`'s own errors do -- the currently-impossible check this fix
      makes possible. QA-caught gap, fixed at drafting: this new test explicitly
      covers `promote.ts`'s own error identity too (an unknown `promote` change
      id thrown as `QuickChangeError`, asserted `instanceof` the same unified
      class), not only `run.ts`/`commit.ts`'s -- `promote.ts` is one of the four
      files this task touches and had no dedicated coverage naming it anywhere
      in the original draft."
    status: ready
    depends_on: []
    acceptance_criteria:
      - AC004
    context_files:
      - src/core/quick-change/create.ts
      - src/core/quick-change/run.ts
      - src/core/quick-change/commit.ts
      - src/core/quick-change/promote.ts
      - tests/unit/quick-change-lifecycle.test.ts
      - tests/unit/quick-change-commit.test.ts
      - tests/integration/quick-change.test.ts
    write_scope:
      - src/core/quick-change/create.ts
      - src/core/quick-change/run.ts
      - src/core/quick-change/commit.ts
      - src/core/quick-change/promote.ts
      - tests/unit/quick-change-lifecycle.test.ts
    mapped_ac_ids:
      - AC004
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/quick-change-lifecycle.test.ts
        tests/unit/quick-change-commit.test.ts
        tests/integration/quick-change.test.ts
    result: null
    usage: null
