    name: Execution-strategy config gate
    objective: "Add the additive-optional `execution` block to `configSchema`
      (`src/state/schemas.ts`) with `strategy: z.enum(['sequential',
      'parallel_worktrees'])`, plus a `resolveExecutionStrategy(config)` helper
      returning `'sequential'` when the block is absent — mirroring M012's
      `git.branch_strategy`/`resolveBranchStrategy` pattern exactly, including
      its comment conventions. Unit tests: absent block resolves sequential;
      explicit sequential resolves sequential; parallel_worktrees resolves
      parallel_worktrees; unknown strategy value rejected; every pre-existing
      config fixture still parses unchanged. Integration test (new file
      `tests/integration/execution-strategy.test.ts`): a full task lifecycle
      (in_progress → review → completed with atomic commit) under an absent
      `execution` block and under an explicit `sequential` block produces
      identical outcomes — the provably-unaffected baseline. Per-command
      sequential-refusal tests are owned by T004/T007/T008, not here."
    status: ready
    depends_on: []
