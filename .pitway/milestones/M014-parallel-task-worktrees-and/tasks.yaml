      kind), (3) create the worktree via T003. CLI registration in
      `src/cli/commands/task-dispatch.ts` + `src/cli/index.ts`. `--json` is the
      worker handoff envelope only (task id, absolute worktree path, branch,
      created-from revision) — it never embeds the context bundle; the driver
      obtains the bundle at the main root via `task-status <id> --context` and
      passes it to the worker (documented in T010). Integration tests: two
      eligible tasks dispatch side by side; overlapping third refused naming the
      conflict; overlap with an INLINE in_progress task refused;
