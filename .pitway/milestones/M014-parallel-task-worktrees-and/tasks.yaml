      contract/task amendment exists for the milestone (derivePending non-empty
      → diagnostic says to complete a checkpoint commit first, because a
      worktree would otherwise serve the stale pre-amendment contract); then the
      normative order: (1) `ready → in_progress` through the existing
      state-machine/journal path with attempts increment, (2) append the new
      `worktree_dispatch` journal record (milestone id, task id, branch,
