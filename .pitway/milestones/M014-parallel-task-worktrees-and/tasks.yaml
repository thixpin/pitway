  - id: T007
    name: task-integrate command and crash recovery
    objective: "Wire `pitway task-integrate <taskId>` (CLI registration in
      `src/cli/commands/task-integrate.ts` + `src/cli/index.ts`) and deliver
      AC006's idempotent re-run/crash-recovery semantics on top of T006's
