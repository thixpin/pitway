  - id: T003
    name: Git worktree module
    objective: "Implement `src/git/worktree.ts` per AC003: `createTaskWorktree`
      (worktree at `.pitway-worktrees/<milestoneId>-<taskId>/` on fresh branch
      `pitway/task/<milestoneId>-<taskId>` from current HEAD; refuse on existing
      path or branch, never reuse/reset; idempotent one-time `.git/info/exclude`
      entries for BOTH `.pitway-worktrees/` and the anchored
      `/.pitway-worktree.yaml` marker — the second is what lets `git worktree
      remove` succeed without --force and keeps the marker out of worker `git
      add -A`; --force is never used on the normal path and the marker is never
      deleted separately before removal; write the uncommitted
      `.pitway-worktree.yaml` runtime marker with milestone id, task id,
      created-from revision), `listTaskWorktrees` (parse `git worktree list
      --porcelain`, filter to the managed prefix, read markers),
      `removeTaskWorktree` (remove worktree + delete scaffolding branch; refuse
      on paths outside the managed prefix), and `detectTaskWorktree` (resolve
      top-level via `git rev-parse --show-toplevel`, never trusting cwd, then
      read the marker). Reuse `src/git/exec.ts` for all git invocations and
      respect `src/git/paths.ts`'s linked-worktree git-dir handling. Integration
      tests against real temp repos prove each primitive plus: main tree, index,
      and checked-out branch untouched by create/remove; removal succeeds
      without --force with the marker present; exclude entries written exactly
      once across repeated creates; refusal cases; marker contents; subdirectory
      detection."
    status: ready
    depends_on: []
