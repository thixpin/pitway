  - id: T002
    name: Parallel-eligibility Core function
    objective: "Implement the pure eligibility check
      (`src/core/tasks/parallel-eligibility.ts`):
      `checkParallelEligibility(candidate, concurrent, allTasks)` where
      `concurrent` is ALL currently in_progress tasks — dispatch-backed and
      inline alike (an inline overlap is the same two-writers hazard). Returns a
      structured result that either approves or names the specific failing rule
      and conflicting task/paths. Rules per AC002: candidate `ready`; no
      transitive dependency in either direction between candidate and any
      concurrent task (reuse `src/core/tasks/dependencies.ts` — never
      re-implement graph traversal; extract/export a reachability helper there
      if needed; rule is redundant-by-construction given rule 1 and kept as
      defense-in-depth with a comment saying so); pairwise-disjoint
      `write_scope` by exact path comparison; both sides must declare
      `write_scope` (legacy `relevant_files` tasks are never eligible). Unit
      tests cover the eight AC002 cases at minimum, including
      overlap-with-inline-in_progress."
    status: ready
    depends_on: []
    acceptance_criteria:
      - AC002
    context_files:
