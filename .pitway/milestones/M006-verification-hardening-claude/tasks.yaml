        asset destination list (src/state/claude-assets.ts's new
        listClaudeAssetDestinations(), the one authoritative source) through an
        agent-agnostic extraExpectedPaths parameter on
        computeExpectedBaselinePaths, resolved by its Core-layer caller
        (confirm.ts) -- never a broad .claude/** allowance; an unmanaged
        .claude/ file is still refused (regression-tested). RED-then-GREEN
        proven explicitly for the hotfix (wiring temporarily reverted, 19 tests
        failed with the exact diagnosed symptom, restored, 33 targeted tests
        passed). Full suite run twice after the complete fix with an explicit
        bounded timeout: 493/493 both times, zero orphan processes both times."
