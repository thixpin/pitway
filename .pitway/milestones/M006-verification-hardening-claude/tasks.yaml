      - src/integrations/claude/commands/usage-add.md
      - src/integrations/claude/commands/write-ms-artifacts.md
      - src/state/claude-assets.ts
      - src/cli/commands/init.ts
      - src/core/tasks/write-scope-check.ts
      - src/core/tasks/update.ts
      - tests/integration/init.test.ts
      - tests/unit/write-scope-check.test.ts
      - tests/integration/task-update.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/integration/init.test.ts
        tests/unit/write-scope-check.test.ts
        tests/integration/task-update.test.ts
    result:
      summary: "[truncated] kWriteScope(writePaths, task), write-only,
        write_scope-then-relevant_files fallback, zero claim about
        context_files. src/core/tasks/update.ts: --result summary/evidence now
        capped (300/1000 chars) via T001's shared trimTail, with a visible
        truncation marker, applied only to fresh writes."
      evidence: "[truncated] itWay trailer, outside this task's write_scope): default
        init's new .claude/ installation exposed a real M002/M004-era gap in
        src/git/baseline.ts (computeExpectedBaselinePaths never knew about
        anything outside .pitway/), causing 79 deterministic failures across 5
