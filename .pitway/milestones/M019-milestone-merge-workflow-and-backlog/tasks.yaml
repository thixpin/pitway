      parseSelection/promptForRoles's selection logic is unchanged. No checkbox
      or HTML markup; no ANSI bold by default (AC014, AC015, AC016)."
    status: ready
    depends_on: []
    acceptance_criteria:
      - Every REVIEW_ROLES entry has a new label field, 3-8 words, distinct from
        and additional to its existing focus string; focus's own value is
        byte-for-byte unchanged (a test diffs it against the current value)
      - The 9 role ids are unchanged -- no role added, removed, or renamed
      - "formatRoleList() renders each role as '<Role Name>: <label>' (role name
