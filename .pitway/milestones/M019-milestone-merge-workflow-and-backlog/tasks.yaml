        its output"
      - promptForRoles/parseSelection's numeric-selection behavior is unchanged
        by this task (same inputs still select the same roles)
    write_scope:
      - src/core/reviews/roles.ts
      - src/cli/review-prompt.ts
      - tests/unit/review-roles.test.ts
      - tests/integration/milestone-review-interactive.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/review-roles.test.ts
        tests/integration/milestone-review-interactive.test.ts
    result: null
    usage: null
  - id: T005
    name: B003 -- backlog storage scalability investigation
    objective: "Write docs/evidence/M019/backlog-scalability.md: evaluate
      .pitway/backlog.yaml's current single-file, whole-load/whole-save design
      (loadBacklog/saveBacklog, src/state/store.ts) against realistic PitWay
      usage -- a single-developer-in-the-loop, human-paced workflow tool -- and
      reach an explicit, justified conclusion. No production code change is made
      in this task regardless of the conclusion reached (AC017)."
    status: ready
    depends_on: []
    acceptance_criteria:
      - docs/evidence/M019/backlog-scalability.md exists and reasons from the
        current implementation (confirmed by inspection, cited directly) rather
        than assumption
      - The document reaches and justifies an explicit conclusion, honestly
        stated even if it is 'no redesign is warranted at current/foreseeable
        scale'
      - No file outside docs/evidence/M019/ is modified by this task
    write_scope:
      - docs/evidence/M019/backlog-scalability.md
    verification:
      strategy: manual
      detail: developer/driver review per CT011's instruction
    result: null
    usage: null
  - id: T006
    name: Backlog promotion dogfooding and roadmap reconciliation
    objective: "After this milestone is confirmed: run pitway backlog promote B001
      --task T003, backlog promote B002 --task T004, and backlog promote B003
      --task T005 for real against the live .pitway/backlog.yaml -- the first
      real exercise of backlog promote since M018 shipped it. These calls need
      no .pitway/backlog.yaml entry in this task's write_scope: a pending
      backlog_recording journal entry is already classified as an expected dirty
      path by the existing, unmodified classifyDirtyPaths({ journalMilestone })
      allowlist, mirroring M018's own precedent exactly -- no task in M018 ever
      declared backlog.yaml in write_scope either. All three promote calls ride
      along in this task's own single completion commit alongside its
      IMPLEMENTATION_PLAN.md change; no dedicated commit is created for them.
      Then reconcile IMPLEMENTATION_PLAN.md: the command-surface count (24 ->
      25), the shipped-asset count for the 8 new docs (milestone-merge.md + 7
      ms-*.md), the Bootstrap delivery table gaining M018's own row, and the
      Revised Roadmap header/entry reflecting M018 delivered and M019. Also
      reapply and commit the developer's own pre-existing
      docs/assets/workflow.mmd/.svg edit (a Backlog node plus an 'Executing
      Tasks' subgraph label, stashed before this milestone's confirmation so its
      baseline commit could proceed on a clean tree) -- folded into this task's
      write_scope and single completion commit rather than a separate standalone
      commit, per explicit developer decision at confirm time (AC018, AC019,
      AC020, AC021)."
    status: waiting
    depends_on:
      - T002
      - T003
      - T004
      - T005
    acceptance_criteria:
      - "pitway backlog show B001/B002/B003 each read status: promoted, with
        promoted_to correctly naming M019 and T003/T004/T005 respectively"
      - pitway backlog list --status pending shows only B004 remaining
      - IMPLEMENTATION_PLAN.md's command-surface count reads 25
      - IMPLEMENTATION_PLAN.md's shipped-asset count reflects the 8 new docs
      - The Bootstrap delivery table includes M018's row
      - The Revised Roadmap header/entry reflects M018 delivered and names M019
      - Any other discovered drift between the document and this milestone's
        actual delivery is corrected in this task, not left stale
      - docs/assets/workflow.mmd/.svg carry the stashed Backlog-node/
        Executing-Tasks-label edit, committed in this task's own commit
    write_scope:
