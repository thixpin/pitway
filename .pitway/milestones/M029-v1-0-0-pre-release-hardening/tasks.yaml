    name: Release hygiene — merged branches and stale worktree
    objective: "Enumerate every pitway/M0xx branch; for each run git merge-base
      --is-ancestor <branch> main and delete only on success (git branch -d,
      which itself refuses unmerged). Remove the stale temporary worktree
      registration (path under the system temp dir, detached HEAD at the M024
      baseline) via git worktree remove --force if its directory still exists,
      else git worktree prune. Confirm final state: only main plus any
      intentionally kept branches remain; git worktree list shows only the main
      checkout. Purely git operations -- no code changes."
    status: ready
    depends_on: []
    acceptance_criteria:
      - no pitway/M0xx branch remains unless deliberately excluded and disclosed
      - stale temp-dir worktree deregistered/pruned; worktree list shows main
        only
      - zero source diffs in this task
    write_scope: []
    verification:
      strategy: manual
      detail: git branch; git worktree list; confirm clean state per CT002.
    result: null
    usage: null
