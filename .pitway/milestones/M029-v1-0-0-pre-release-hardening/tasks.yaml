schema_version: 1
tasks:
  - id: T001
    name: task-verify --timeout flag (TDD)
    objective: "RED first: extend tests/unit/task-verify.test.ts (and/or the
      integration suite) with (a) flag-validation cases -- --timeout below 1000
      or above 3600000 refuses naming the bound, non-numeric refuses; (b) a real
      subprocess whose runtime exceeds the 120s default budget is impossible in
      unit time, so instead pin pass-through by asserting the recorded evidence
      record's durationMs/terminationReason path uses the supplied value via a
      sleep-based integration case (e.g. 'sleep 2' with --timeout 500 fails as
      timeout, and the same command with --timeout 5000 passes) proving the
      value reaches executeCommand for both the verification command and
      --typecheck. GREEN: add the option to src/cli/commands/task-verify.ts and
      thread it through src/core/tasks/verify.ts into both executeCommand calls;
      default stays DEFAULT_TIMEOUT_MS. Update commands/task-verify.md in all
      three drivers (+ms alias if one exists -- none does) with the new flag,
      refresh the claude-assets hash manifest."
    status: completed
    depends_on: []
    acceptance_criteria:
      - RED tests land first and fail before implementation; GREEN after
      - bounds enforced (1000..3600000), default unchanged at 120000ms
      - timeout reaches verification and typecheck execution paths (sleep-based
        proof)
      - task-verify.md updated across all drivers; parity + manifest green
    write_scope:
      - src/cli/commands/task-verify.ts
      - src/core/tasks/verify.ts
      - src/integrations/claude/commands/task-verify.md
      - src/integrations/opencode/commands/task-verify.md
      - src/integrations/codex/commands/task-verify.md
      - tests/unit/task-verify.test.ts
      - tests/integration/task-verify.test.ts
      - tests/unit/claude-assets.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/unit/task-verify.test.ts
        tests/integration/task-verify.test.ts tests/unit/claude-assets.test.ts
        tests/unit/opencode-assets.test.ts tests/unit/codex-assets.test.ts
    result:
      summary: "task-verify --timeout flag: 1000..3600000ms bounds validated before
        any state access, default 120000 unchanged, threaded to verification +
        typecheck execution; platform-neutral node-timer proofs; docs x3 drivers
        + manifest refresh. RED first (4 failing) then GREEN."
      evidence: Tests  334 passed (334) | Start at  14:35:32 | Duration  17.37s
        (transform 666ms, setup 0ms, import 1.11s, tests 28.10s, environment
        0ms)
    attempts: 1
    usage: null
