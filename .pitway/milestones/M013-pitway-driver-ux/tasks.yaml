  - id: T005
    objective: "Add a new Core function (`src/core/milestones/footer.ts`,
      `computeRacingFooter(...)`) rendering the exact one-line racing footer
      `🏎️ ~<workload>% · ✅ <completed>/<total> · Next: <task/gate>` using
      T003's workload percentage and the existing `computeMilestoneProgress`
      count. Extract the next-dependency-ready-task/gate resolution currently
      private inside `resume.ts`'s `buildResumeView` into one shared exported
      helper so `resume` and `milestone-status` never duplicate it. Returns
      `null` when `status` is `draft`. Icon precedence: `🏁` (status completed,
      trailing segment reads `Complete`) > `🔧` (any task `blocked`) > `🏁` (all
      required tasks completed, milestone not yet completed, trailing segment
      reads `Next: <task/gate>` -- shares the `🏁` icon with the completed case,
      distinguished only by that trailing text) > `🏎️` (default). Wire a
      `footer: string | null` field into both `pitway resume` and `pitway
      milestone-status <id>` (human: final line when non-null, entirely absent
      when null; `--json`: the field is always present, `null` when withheld).
      Unit tests cover all four icon cases plus the draft-returns- null case;
      integration tests confirm the footer line appears/is absent correctly in
      both commands' human and JSON output."
    status: completed
    depends_on:
