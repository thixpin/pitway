  - id: T006
    objective: "Add a `--report` flag to `pitway milestone-status <id>` rendering
      the on-demand structured Progress Report, in order: title; T003's workload
      percentage plus completed/total count; recorded token total and
      missing-usage count (existing `aggregateUsage`, unchanged); a task table
      (id; `name` when present via T002, else `objective` truncated to 60 chars
      with a trailing ellipsis when cut; execution mode when recorded, blank
      otherwise; evidence-honest status per AC007 -- `completed · verified` only
      when a `task_verify_evidence` journal record for that exact milestone+task
      has an `evidence` string matching the task's persisted `result.evidence`
      (add a small exported helper, e.g. `hasVerifiedEvidence(root, milestoneId,
      task): boolean`, to `src/core/tasks/update.ts`, reusing `readJournal`
      (`src/state/journal.ts`) the same way `resolveTaskVerifyEvidence` already
      does rather than a second scanning implementation), plain `completed`
      otherwise, every other status via the existing `taskStatusLabel`;
      runtime-reported task tokens or `N/A`); T004's critical path; the active
      in-progress task and next ready task; a token breakdown limited to
      task/planning/qa/total/missing -- explicitly no `driver_overhead` line
      (see contract Objective); T005's racing footer as the final line.
      `--report` composes with `--json` exactly as the command's existing
      default view does. Integration tests cover: the full report shape
      end-to-end against a real fixture milestone with a mix of
      verified/plain-completed/in-progress/ready tasks (including at least one
      completed task with a real task-verify evidence record and one completed
      via plain `--result`/`--message`); the token-breakdown section contains no
      driver_overhead key in either human or JSON output; a task with no `name`
      renders its truncated objective, not a bare id."
