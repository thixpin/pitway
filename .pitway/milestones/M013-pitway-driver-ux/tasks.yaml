  - id: T003
    objective: "Add a new, pure, exported Core function
      (`src/core/milestones/workload.ts`, `computeWorkloadPercentage(status:
      MilestoneStatus, progress: MilestoneProgress, verificationPassed:
      boolean): number`) implementing the exact five-band cumulative workload
      formula: drafting 5%; +5% (10% cumulative) once confirmed or later;
      weighted task execution up to +75% (85% cumulative) scaled by
      `progress.completed / progress.total` (0 when total is 0); +10% (95%
      cumulative) once `verificationPassed` is true; +5% (100%, only exactly
      100%) once `status` is `completed`. Round to nearest integer. Unit tests
      must prove the exact boundary values described in AC003: draft->5,
      confirmed/0-progress->10, confirmed/all-tasks-done/not- verified->85,
      confirmed/all-tasks-done/verified->95, completed->100 (and no other
      combination yields 100)."
    status: completed
    depends_on: []
