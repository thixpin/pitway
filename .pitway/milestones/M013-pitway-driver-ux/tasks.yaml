schema_version: 1
tasks:
  - id: T001
    objective: "Extract the per-check latest-result derivation currently private
      inside `src/core/milestones/complete.ts`'s `assertGatesSatisfied` into one
      small, shared, exported Core function, e.g.
      `src/core/verification/status.ts`: `computeLatestCheckResults(root:
      string, milestoneId: string, contract: ContractFile): Map<string, 'pass' |
      'fail'>` (or an equivalent narrow return shape). Refactor `complete.ts` to
      call this helper instead of its own private copy -- zero behavior change,
      proven by the existing `milestone-complete` test suite passing unchanged.
      Then add a `--status` flag to `pitway verify <id>`
      (`src/cli/commands/verify.ts`): reads `verification-results.yaml` via the
      new shared helper and renders every declared check with its latest
      recorded status (`✅ pass` / `❌ fail`) or `⏳ pending` when nothing has been
      recorded yet, without executing any command and without mutating
      `verification-results.yaml`. Works regardless of milestone status (draft
      through completed). This is the first task in the graph because AC003's
      workload percentage and AC004/AC005's footer/report all need this same
      shared helper to derive a `verificationPassed` boolean -- one
      implementation, not reimplemented per caller."
    status: completed
    depends_on: []
    acceptance_criteria:
      - AC008
    context_files:
