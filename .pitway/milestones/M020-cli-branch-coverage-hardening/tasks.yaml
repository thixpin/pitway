schema_version: 1
tasks:
  - id: T001
    name: milestone-review.ts branch coverage
    objective: "Bring src/cli/commands/milestone-review.ts from 17/45 (37.8%) to
      >=90% branch coverage via new test cases in the existing
      tests/integration/milestone-review-*.test.ts files. Focus on
      renderReportHuman's rendering permutations: a pending (not-yet-recorded)
      role vs. a recorded one, supersededCount > 0 vs. 0, a role with zero
      findings ('clean review' message) vs. one or more, a finding with targets
      present/absent, unknownTargets present/absent within targets,
      conflictsWith present/absent, non-empty sharedTargetConflicts, and
      non-empty declaredConflicts. Also cover the `start` command's non-TTY
      refusal when --roles is omitted, and renderDecideHuman's
      revision_requested branch vs. accepted/rejected. Test-only changes
      expected; no production behavior change (AC002)."
    status: in_progress
    depends_on: []
    acceptance_criteria:
      - src/cli/commands/milestone-review.ts reaches >=41/45 (>=90%) branch
        coverage measured via a real vitest run --coverage
      - renderReportHuman's pending-role, superseded-snapshot, zero-findings,
        targets/unknownTargets/conflictsWith, and both conflict-group branches
        are each covered by a real assertion on rendered output, not just
        view-object shape
      - the start command's non-TTY-without-roles refusal and
        renderDecideHuman's revision_requested-vs-other branch are both covered
      - no production behavior in milestone-review.ts changes; the file's diff
        (if any) is test-support only
    write_scope:
      - src/cli/commands/milestone-review.ts
      - tests/integration/milestone-review-brief.test.ts
      - tests/integration/milestone-review-decide.test.ts
      - tests/integration/milestone-review-interactive.test.ts
      - tests/integration/milestone-review-lifecycle.test.ts
      - tests/integration/milestone-review-record.test.ts
      - tests/integration/milestone-review-report.test.ts
      - tests/integration/milestone-review-start.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/integration/milestone-review-brief.test.ts
        tests/integration/milestone-review-decide.test.ts
        tests/integration/milestone-review-interactive.test.ts
        tests/integration/milestone-review-lifecycle.test.ts
        tests/integration/milestone-review-record.test.ts
        tests/integration/milestone-review-report.test.ts
        tests/integration/milestone-review-start.test.ts
    result: null
    attempts: 1
    usage: null
