      - add/list/show/promote are byte-for-byte unchanged and still refuse with
        no active milestone
      - a real regression test proves backlog archive succeeds with no active
        milestone, and a second test proves add/promote still refuse
    write_scope:
      - src/state/journal.ts
      - src/core/backlog/archive.ts
