  - id: T008
    name: Real <head> meta injection (title/description/canonical/OG)
    objective: "Extend website/scripts/build.mjs to parse YAML front-matter (a ---
      ... --- block at the top of each Markdown source) for title, description,
      canonical, ogType, ogTitle, ogDescription, ogUrl, and ogSiteName, and
