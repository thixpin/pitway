      outside their write_scope, meta description/canonical/OG tags had to be
      embedded as raw HTML inside <body> instead of <head>, which real search
      engines/social crawlers largely ignore -- AC002/AC003's SEO requirement
      was met textually but not functionally. Update
      website/scripts/build.test.mjs first (TDD: RED before GREEN) to test
      front-matter parsing and head injection. Then migrate T002's homepage and
      all 17 of T003's documentation pages (16 content pages + the docs index)
      from the raw-HTML-in-body workaround to real front-matter, removing the
      now-redundant embedded <meta>/<link rel=canonical>/OG lines from each
      page's body. Each page's actual navigation chrome
      (sidebar/breadcrumbs/prev-next) and section content are otherwise
      unchanged in substance -- this is a metadata-placement fix, not a content
      rewrite."
    status: completed
    depends_on:
