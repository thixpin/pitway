      - a documented manual-check list exists for keyboard navigation, reduced
        motion, and video captions
    write_scope:
      - website/scripts/check-seo.mjs
      - website/scripts/check-a11y.mjs
      - website/content/manual-checks.md
    verification:
      strategy: command
      detail: cd website && npm run build && npm run check:seo && npm run check:a11y
    result: null
    usage: null
  - id: T006
    name: Hosting build+deploy pipeline (deploy-ready, not deployed)
    objective: "Add .github/workflows/website-deploy.yml that runs website/'s full
      production path -- npm run build (which unconditionally produces
      sitemap.xml/robots.txt per T001), then npm run check:seo && npm run
      check:a11y as a pre-deploy quality gate -- and is written to deploy that
      exact build output to S3 fronted by CloudFront via AWS OIDC (no long-lived
      AWS credential), matching this repository's existing workflow conventions
      (actions/checkout, actions/setup-node with an explicit Node version,
      minimal least-privilege permissions, explanatory header comments). This
      task delivers a deploy-ready, workflow-validated pipeline, not a real
      production deployment: no AWS OIDC trust, S3 bucket, CloudFront
      distribution, or DNS for the target domain (pitway.thixpin.me) exists yet
      (confirmed by inspection -- nothing AWS-related exists anywhere in this
      repository today). The workflow's build-validate-audit steps run and pass
      in CI regardless; the deploy step will not run for real until the
      developer completes those external, one-time prerequisites, documented
      plainly in the workflow's own comments. No backend, database,
      authentication, or CMS."
    status: waiting
    depends_on:
      - T001
      - T002
      - T003
      - T004
      - T005
    acceptance_criteria:
      - a GitHub Actions workflow runs build, check:seo, and check:a11y, then is
        written to deploy that exact static output to S3/CloudFront via AWS OIDC
      - the deployed artifact (as built by this same workflow) always contains
        sitemap.xml and robots.txt -- no separate manual step required
      - the workflow matches this repository's existing conventions
        (checkout/setup-node versions, minimal permissions, header comments) as
        seen in test.yml and publish.yml
      - the workflow's build-validate-audit steps run and pass in CI regardless
        of whether AWS OIDC trust, S3/CloudFront, or DNS are configured yet;
        each external prerequisite is documented in-file
      - this task does not claim, attempt, or verify a real production deployment
      - no backend, database, authentication, or CMS is introduced
    write_scope:
