schema_version: 1
tasks:
  - id: T001
    name: Build pipeline site identity, title/robots keys, noindex-aware sitemap
    objective: 'website/scripts/sitemap.mjs: export SITE_NAME = "PitWay" beside
      DEFAULT_SITE_URL; generateSitemapAndRobots additionally excludes any
      *.html whose <head> contains a <meta name="robots"> whose content includes
      noindex (read each file; keep the existing 404.html exclusion).
      website/scripts/build.mjs: (1) renderMarkdownToHtml always emits <meta
      property="og:site_name" content="PitWay"> (from SITE_NAME) and <meta
      name="twitter:card" content="summary">, placed with the other og/meta
      tags; remove ogSiteName from FRONT_MATTER_OG_TAGS so a stale per-page
      value can no longer override the constant; (2) honour meta.robots -> <meta
      name="robots" content="...">; (3) buildContentPages computes heading =
      titleFromMarkdown(content, basename) and uses data.title ?? heading as the
      <title>, passing both title and heading through to renderMarkdownToHtml
      (heading is consumed by T002). The bare-head fallback test changes
      accordingly: a page with no front matter now still carries og:site_name
      and twitter:card (both are constants, not front-matter driven). TDD in
      website/scripts/build.test.mjs: og:site_name is PitWay even when the
      fixture declares ogSiteName: "Fixture Docs"; twitter:card present; title:
      overrides the h1-derived title and falls back when absent; robots: emits
      the meta and is absent otherwise; a temp-dir build with one noindex page
      proves it is built but excluded from sitemap.xml while indexable pages
      remain.'
    status: completed
    depends_on: []
    acceptance_criteria:
      - Every rendered page carries og:site_name PitWay and twitter:card
        summary; ogSiteName front matter no longer influences output.
      - "The title: and robots: front-matter keys are honoured with the
        documented fallbacks; noindex pages are excluded from sitemap.xml."
    context_files:
      - website/scripts/build.mjs
      - website/scripts/sitemap.mjs
      - website/scripts/build.test.mjs
      - website/scripts/__fixtures__/sample.md
      - website/content/index.md
      - website/content/404.md
    write_scope:
      - website/scripts/build.mjs
      - website/scripts/sitemap.mjs
      - website/scripts/build.test.mjs
    verification:
      strategy: tdd
      detail: node website/scripts/build.test.mjs
      timeout_ms: 300000
    result:
      summary: "[truncated] sing the h1 through as heading for T002. build.test.mjs: 6
        new cases (SITE_NAME, ogSiteName ignored, title: override, robots: meta,
        end-to-end title/robots, noindex-aware sitemap incl. a non-noindex
        robots meta staying listed) and 3 existing assertions updated for the
        constant site name."
      evidence: ℹ skipped 0 | ℹ todo 0 | ℹ duration_ms 1899.19325
    attempts: 1
    driver: Claude Code
    model: claude-fable-5
    usage: null
  - id: T002
    name: JSON-LD WebSite, SoftwareSourceCode, and BreadcrumbList emission
    objective: 'website/scripts/build.mjs: add a pure buildJsonLd({ canonical,
      heading, description, robots, siteUrl, project }) returning an array of
      schema.org objects, and emit each as <script type="application/ld+json">
      in <head> using JSON.stringify with every < replaced by \u003c (never
      escapeHtml). Rules: robots containing noindex or no canonical -> [].
      canonical === `${siteUrl}/` (homepage) -> [WebSite { @context
      https://schema.org, @type WebSite, name SITE_NAME, url `${siteUrl}/`,
      description }, SoftwareSourceCode { @context, @type SoftwareSourceCode,
      name SITE_NAME, description, url `${siteUrl}/`, codeRepository,
      programmingLanguage "TypeScript", runtimePlatform "Node.js", license,
      author { @type Person, name, url } }] where codeRepository is package.json
      repository.url with the leading git+ and trailing .git stripped, license
      is `${codeRepository}/blob/main/LICENSE` when package.json license is MIT,
      and author name/url come from package.json author -- `project` is loaded
      once by main()/buildContentPages from REPO_ROOT/package.json and passed in
      (tests pass a literal). Any other canonical -> [BreadcrumbList { @context,
      @type BreadcrumbList, itemListElement: ListItem 1 { name SITE_NAME, item
      `${siteUrl}/` }, ListItem 2 { name "Docs", item
      `${siteUrl}/docs/index.html` } (omitted when canonical IS that URL), last
      ListItem { name heading, item canonical } }] with positions 1..n. TDD in
      build.test.mjs: homepage fixture yields exactly WebSite +
      SoftwareSourceCode with the package.json-derived values (assert against a
      literal project object); a docs fixture yields a 3-item BreadcrumbList;
      the docs-index canonical yields 2 items; a noindex fixture and a fixture
      without canonical yield no ld+json; every emitted block round-trips
      through JSON.parse; a description containing </script> is emitted with
      \u003c and never closes the script element.'
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - Homepage emits accurate WebSite + SoftwareSourceCode JSON-LD sourced
        from package.json; no Organization, offers, or ratings.
      - Indexable non-home pages emit the linked-trail BreadcrumbList; noindex
        pages and pages without canonical emit none; output is valid JSON with <
        escaped.
    context_files:
      - website/scripts/build.mjs
      - website/scripts/sitemap.mjs
      - website/scripts/build.test.mjs
      - package.json
      - website/content/index.md
      - website/content/docs/index.md
      - website/content/concepts/tasks.md
    write_scope:
      - website/scripts/build.mjs
      - website/scripts/build.test.mjs
    verification:
      strategy: tdd
      detail: node website/scripts/build.test.mjs
      timeout_ms: 300000
    result:
      summary: '[truncated] tted in <head> as <script type="application/ld+json"> via
        JSON.stringify with < escaped as \u003c (never escapeHtml).
        buildContentPages accepts { project, siteUrl }; main() loads the project
        metadata. 6 new tests incl. the </script>-in-description escape and an
        end-to-end temp-dir build.'
      evidence: ℹ skipped 0 | ℹ todo 0 | ℹ duration_ms 1723.07625
    attempts: 1
    driver: Claude Code
    model: claude-fable-5
    usage: null
