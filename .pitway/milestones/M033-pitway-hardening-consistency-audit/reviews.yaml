              - t001
            recommendation: >
              Before confirmation, either drop the consolidation clause from
              AC005/CT005, or add an explicit T001 acceptance criterion naming
              which duplication (store.ts sites or journal.ts append* wrappers)
              it covers.
          - severity: minor
