schema_version: 1
tasks:
  - id: T001
    name: Harden journal write crash safety
    objective: >
      Add an atomic-write helper (write to a temp file in the same directory,
      then rename) used only by src/state/journal.ts's saveJournalFile -- the
      sole PitWay-managed file deliberately kept outside git tracking (resolves
      to .git/pitway/journal.yaml) and therefore without git's own
      crash-recovery backstop. Git-tracked state files (routed through store.ts)
      are intentionally untouched: a torn write there is already recoverable via
      the standard dirty-tree `git checkout` path. No change to the journal's
      file path, format, or existing checkpoint/reconciliation semantics.
    status: in_progress
    depends_on: []
    acceptance_criteria:
      - saveJournalFile writes via temp-file-then-rename.
      - A simulated interrupted write leaves the previously-committed journal
        content readable and unchanged; loadJournalFile ignores a stray leftover
        temp file.
      - No change to the journal's file path, schema, or reconcilePending's
        checkpoint-marker healing behavior.
    context_files:
      - src/state/journal.ts
      - src/git/paths.ts
      - tests/unit/journal.test.ts
    write_scope:
      - src/state/journal.ts
      - tests/unit/journal.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/unit/journal.test.ts
    result: null
    attempts: 1
    usage: null
