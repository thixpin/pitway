      MVP" line so it accurately reflects the shipped parallel_worktrees
      execution strategy and branch_strategy: milestone. Check the website pages
      most likely to mirror the same claims and correct any found stale.
    status: in_progress
    depends_on: []
    acceptance_criteria:
