  - id: T002
    name: Backlog core lifecycle (add/promote/archive/list/show)
    objective: "Implement the core backlog lifecycle in src/core/backlog/
      (add/promote/archive/list/show). Journal attachment is unconditional:
      every mutation reads state.active_milestone directly (no override
      parameter anywhere in this module's public functions) and refuses with 'no
      active milestone; run milestone-add or resume the active one first' when
      it is null. backlog add's --milestone/--task populate source only
      (source.milestone defaults to the active milestone when --milestone is
      omitted; source.task is recorded only when --task is given explicitly,
      never inferred); when given, each is validated against state.yaml/that
      milestone's tasks.yaml. pending -> promoted|archived transition validation
      (both terminal, every other transition rejected by name). promote <id>
      --task <task-id> [--milestone <milestone-id>] resolves --milestone to the
      active milestone when omitted, requires the referenced task to already
      exist, records promoted_to, and never creates a task/milestone itself.
      Write ordering appendJournalEntry(type: 'backlog_recording', milestone:
      state.active_milestone) -> saveBacklog, mirroring task-add.ts's own write
      ordering exactly -- no dedicated commit, no new git primitive (AC001,
      AC002, AC003, AC004, AC005)."
    status: ready
    depends_on:
      - T001
    acceptance_criteria:
      - pending -> promoted and pending -> archived are the only valid
        transitions; every other requested transition (already-promoted,
        already-archived) is rejected by name
      - backlog add without --milestone/--task, run with an active milestone,
        records source.milestone as that active milestone and leaves source.task
        null
      - backlog add --milestone <id> records that value as source.milestone only
        (does not change which milestone the journal entry attaches to); backlog
        add --task <id> records source.task
      - backlog add/promote/archive with no active milestone fail with 'no
        active milestone; run milestone-add or resume the active one first'
      - A test proves journal attachment always uses state.active_milestone and
        that no combination of CLI flags on any backlog subcommand can redirect
        it to a different milestone -- including a deliberately supplied id of
        an existing but completed/cancelled milestone
      - backlog promote <id> --task <task-id> [--milestone <id>] treats both
        flags as the promotion target only; when --milestone is omitted it
        resolves to the active milestone; the referenced task must already
        exist; a test proves promote does not call task-add/milestone-add's core
        functions
      - backlog archive has no --milestone/--task parameter in its core function
        signature or CLI wiring (T003)
      - "A test proves the dirty-tree/scope integration directly: after backlog
        add runs mid-task (an in-progress task's own write_scope left
        legitimately dirty), that task's own task-update in_progress/completed
        clean-tree check still succeeds because .pitway/backlog.yaml is resolved
        as an expected path via classifyDirtyPaths({ journalMilestone }) -- no
        change to git/safety.ts or tasks/update.ts"
      - A test proves reconcilePending checkpoints a pending backlog_recording
        entry once the active milestone's own next commit captures
        .pitway/backlog.yaml's on-disk content, with no code change to
        reconcilePending itself, and that no dedicated backlog commit is ever
        created
      - backlog list/show are read-only, never write to backlog.yaml or the
        journal
    write_scope:
      - src/core/backlog/add.ts
      - src/core/backlog/promote.ts
      - src/core/backlog/archive.ts
      - src/core/backlog/list.ts
      - src/core/backlog/show.ts
      - src/core/backlog/state-machine.ts
      - tests/unit/backlog-state.test.ts
      - tests/unit/git-safety.test.ts
      - tests/integration/backlog.test.ts
      - tests/integration/task-update.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/unit/backlog-state.test.ts
        tests/unit/git-safety.test.ts tests/integration/backlog.test.ts
    result: null
    usage: null
