    name: Backlog schema, store, and journal operation type
    objective: "Add the backlog state layer: backlogItemSchema/backlogFileSchema
      (schema_version 1, strictObject, status enum pending|promoted|archived, id
      pattern B\\d{3}) in src/state/schemas.ts, and loadBacklog/saveBacklog
      (root-level, via pitwayPath(root, 'backlog.yaml'), absent-tolerant like
      loadVerificationRepairs) plus nextBacklogId (in-memory max+1 scan of the
      loaded items array, mirroring nextSequentialTaskId) in src/state/store.ts.
      Add 'backlog_recording' as a new member of journalOperationTypeSchema in
      src/state/journal.ts (reusing the existing checkpoint-eligible
      entry/checkpoint machinery -- never a new discriminated-union 'kind'
      sibling), and add its resolveTargetPath case ('backlog_recording' ->
      '.pitway/backlog.yaml') in src/core/journal/operations.ts. No CLI or core
      lifecycle logic yet -- pure schema/store/journal-type plumbing (AC001,
      AC003)."
    status: completed
    depends_on: []
    acceptance_criteria:
      - backlogItemSchema/backlogFileSchema exist in src/state/schemas.ts with
        fields id/title/reason/status/source/created_at/resolved_at/
        promoted_to/archived_reason exactly as specified in the contract's AC001
      - loadBacklog/saveBacklog are root-level (not per-milestone-directory)
        functions in src/state/store.ts, mirroring loadState/saveState's
        pattern; loadBacklog returns an empty, schema-valid store when
        .pitway/backlog.yaml does not exist on disk
      - nextBacklogId computes the next sequential B\d{3} id by scanning the
        currently-loaded items array's existing ids, never a directory scan
      - journalOperationTypeSchema gains 'backlog_recording' as a fifth member;
        journalEntrySchema/appendJournalEntry accept it with no further code
        change
      - resolveTargetPath(entry, milestoneDir) returns '.pitway/backlog.yaml'
        for a backlog_recording entry, ignoring milestoneDir, and a test proves
