  - id: T002
    name: Init --codex, coexistence, and managed paths
    objective: "Extend pitway init to support --codex (opt-in, additive alongside
      --opencode and default-on Claude): classify/install the resolved Codex
      asset set into .codex/ (skills at .codex/skills/<name>/SKILL.md, commands
      at .codex/commands/<name>.md, protocol docs at .codex/<name>.md
      root-level, mirroring .claude/.opencode layout per AC004). Ensure existing
      drivers remain unaffected (Claude default-on, --no-claude, Opencode
      --opencode still byte-identical) and all three drivers coexist without
      destination collisions (disjoint .claude/.opencode/.codex) and each
      resolves from its correct PitWay-managed source (driver wins on collision,
      common fallback otherwise). Extend src/state/managed-init-paths.ts (via
      listSafeManagedDirtyPaths) to also recognize installed .codex/ managed
      paths so milestone-confirm/quick-change create do not refuse on a fresh
      Codex install. Extend src/state/claude-assets.ts listInstalledSkillNames
      (the required_skills pre-dispatch gate) to check .codex/skills alongside
      .claude/skills and .opencode/skills. Note: src/git/baseline.ts requires no
      change (generic extraExpectedPaths param); skill gate lives in
      src/state/claude-assets.ts, not src/core/tasks/skills.ts."
    status: ready
    depends_on:
      - T001
    acceptance_criteria:
      - pitway init --codex installs correct Codex assets to .codex/ at
        specified destinations
      - pitway init --codex --opencode and --codex --no-claude coexist without
        collision; existing drivers unaffected
      - Generated Codex assets resolve from correct PitWay-managed source
        (driver vs common)
      - milestone-confirm/quick-change create do not refuse on fresh Codex
        install (managed dirty paths)
      - required_skills gate checks .codex/skills alongside other drivers
    write_scope:
      - src/cli/commands/init.ts
      - src/state/managed-init-paths.ts
      - src/state/claude-assets.ts
      - tests/integration/init.test.ts
      - tests/integration/multi-driver-assets.test.ts
      - tests/unit/managed-init-paths.test.ts
      - tests/unit/skills.test.ts
      - tests/integration/task-status.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/integration/init.test.ts
        tests/integration/multi-driver-assets.test.ts
        tests/unit/managed-init-paths.test.ts tests/unit/skills.test.ts
    result: null
    usage: null
  - id: T003
    name: Codex dogfooding, evidence, and docs
    objective: Execute a real Codex-driven PitWay workflow end-to-end (at least one
      milestone/task) through the installed Codex driver and capture transcript
      evidence in docs/evidence/M026/codex-dogfood.md (honestly scoped to what
      is executable -- Codex CLI availability and sandbox limits -- and not
      claiming a live Codex session when run via emulation). Record
      Codex-specific findings/limitations in
      docs/evidence/M026/codex-limitations.md and/or backlog items (at least the
      .agents/skills vs .codex/skills conflict, TOML agents vs markdown,
      deprecated custom prompts, sandbox/approval differences), not silently
      expanding scope. Add focused tests if needed for dogfood coverage and
      update relevant docs (README.md, IMPLEMENTATION_PLAN.md) in a strictly
      limited, Codex-only diff. No unrelated backlog fixes and no changes to
      existing drivers beyond T001-T002.
    status: waiting
    depends_on:
      - T001
      - T002
    acceptance_criteria:
      - docs/evidence/M026/codex-dogfood.md exists with real workflow evidence
        and honest scoping
      - docs/evidence/M026/codex-limitations.md exists dispositioning at least
        four Codex findings; backlog items created where appropriate
      - No silent scope expansion; no unrelated changes
      - Docs updated in a strictly limited diff; full suite and tsc still green
    write_scope:
      - docs/evidence/M026/codex-dogfood.md
      - docs/evidence/M026/codex-limitations.md
      - README.md
      - IMPLEMENTATION_PLAN.md
      - tests/integration/codex-dogfood.test.ts
      - tests/unit/codex-dogfood.test.ts
    verification:
      strategy: command
      detail: npx vitest run tests/integration/codex-dogfood.test.ts
        tests/unit/codex-assets.test.ts && npm run build && npm test && npx tsc
        --noEmit
    result: null
    usage: null
