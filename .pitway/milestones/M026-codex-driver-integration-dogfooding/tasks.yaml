schema_version: 1
tasks:
  - id: T001
    name: Codex driver registration and command assets
    objective: Register Codex as the third driver in src/state/driver-assets.ts
      (hardcode DRIVERS = ['claude','opencode','codex'] and
      DRIVER_DESTINATION_DIRS[codex]='.codex'; keep the flat static two-tier
      lookup driver-then-common, no dynamic discovery, no manifest, no template
      engine, no Core AI-provider code). Ship Codex command docs under
      src/integrations/codex/commands/ -- 24 canonical + 8 ms-* aliases = 32
      files -- in PitWay's native markdown command-doc format (description
      frontmatter, pitway invocation), content-mirroring the existing Claude
      command docs for the same PitWay surface. Skills and protocol docs are NOT
      overridden for Codex; they resolve to common/ entirely unless a real,
      disclosed incompatibility is found (name it in evidence if so). Ensure
      stray-override guard passes (every file in codex/ either shadows common/
      or is in the declared driver-specific class commands/*.md).
    status: completed
    depends_on: []
    acceptance_criteria:
      - DRIVERS includes codex and DRIVER_DESTINATION_DIRS maps codex to .codex
      - 32 Codex command docs exist (24 canonical + 8 ms aliases), description
        frontmatter present, pitway invocation correct
      - Skills and protocol docs for Codex resolve to common/ (no unnecessary
        overrides); stray-override guard passes
      - No Core AI-provider code, no new adapter model, no dynamic registration
    write_scope:
