schema_version: 1
tasks:
  - id: T001
    name: "Research: Claude Code + OpenCode"
    objective: "Real, sourced research on how Claude Code and OpenCode each
      represent: skills, commands, agents, rules/instructions, metadata,
      arguments, tools, and permissions. Write docs/evidence/M022/claude-code.md
      and docs/evidence/M022/opencode.md, one per tool, each covering all 8
      dimensions (or an explicit 'not applicable' note per dimension where
      genuinely true). Cite real documentation/source URLs -- never invent a
      config shape or field name. For Claude Code, ground findings in this
      repository's own src/integrations/claude/ assets
      (skills/commands/agents.md files) as a real, first-party example, plus
      official Anthropic documentation for anything not exercised locally. For
      OpenCode, use real web research (its own docs/README/config schema)."
    status: ready
    depends_on: []
    acceptance_criteria:
      - claude-code.md and opencode.md each cover all 8 dimensions with real
        citations
      - Claude Code findings are grounded in this repo's own shipped assets plus
        official docs; OpenCode findings cite real external sources
      - no dimension is silently skipped; genuine non-applicability is stated
        explicitly
    write_scope:
      - docs/evidence/M022/claude-code.md
      - docs/evidence/M022/opencode.md
    verification:
      strategy: manual
      detail: Manual review of docs/evidence/M022/claude-code.md and opencode.md for
        real citations and 8-dimension coverage.
    result: null
    usage: null
