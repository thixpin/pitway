  - id: T007
    objective: "Prove, with a real integration test using only already- shipped
      commands (milestone-add, task-update — zero new Core/CLI code), a
      supported path to deliver corrective work for a previously- completed
      task's deliverable later found incomplete: a new task in a subsequent
      milestone that references the original milestone/task id, never reopening
      completed state or rewriting a completion commit. Document the convention
      at docs/evidence/M007/ completed-task-revision-path.md (AC008)."
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - tests/integration/completed-task-revision-path.test.ts exercises the
        real lifecycle order (never task completion before milestone
        confirmation) — milestone-add A, milestone-confirm A, execute and
        complete A's task (its deliverable deliberately incomplete),
        milestone-complete A, THEN milestone-add B, milestone-confirm B, execute
        and complete B's one corrective task, whose objective and completed
        result reference A's milestone/task id
      - The test asserts milestone A remains status completed and its completed
        task/commit are byte-for-byte unchanged throughout every step of B's
        lifecycle, no task ever leaves completed, and B's corrective work is
        separately verified and separately committed under its own trailers
      - No new Core/CLI production code is added — the test uses only existing
        commands
      - The documented convention matches exactly what the test proves
    write_scope:
      - docs/evidence/M007/completed-task-revision-path.md
      - tests/integration/completed-task-revision-path.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/integration/completed-task-revision-path.test.ts
    result:
      summary: "[truncated] ete A, THEN milestone B -> confirm -> corrective task
        referencing A -> complete. A's commit/task remain unchanged and a real
        ancestor of final HEAD. Found and fixed a real bug in the test's own
        fixture (milestone ids are auto-assigned sequentially by milestone-add,
        not developer-chosen)."
      evidence: tests/integration/completed-task-revision-path.test.ts 1/1 pass,
        typecheck clean. docs/evidence/M007/completed-task-revision-path.md
        documents the convention matching what the test proves.
