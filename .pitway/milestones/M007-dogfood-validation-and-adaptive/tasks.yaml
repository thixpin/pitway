schema_version: 1
tasks:
  - id: T001
    objective: "Compile dogfood evidence at docs/evidence/M007/ dogfood-evidence.md:
      fresh-session state reconstruction as a regression-covered scenario, both
      M004/T007 sub-agent interruption outcomes, a task-amendment audit against
      every M005 amendment, a Git traceability audit across M001-M006 (including
      M005's four and all three of M006's standalone hotfix commits — seven
      total, plus 85fa243 classified separately as a between-milestone
      maintenance commit, never merged into that count), a context-efficiency
      before/after comparison against M006's measurements, an investigation and
      decision on M006's disclosed CT012 full-suite flakiness, and one fresh,
      matched inline-vs-sub-agent dispatch pair as evidence for AC010 (AC001)."
    status: completed
    depends_on: []
    acceptance_criteria:
      - Fresh-session resume is covered by a regression test, not only a
        historical note
      - Both M004/T007 sub-agent interruption outcomes have their actual
        resolution recorded only when supported by a durable primary source (Git
        history, .pitway/ state, or a committed report); if no such source
        exists for a specific claimed outcome, that outcome is recorded
        explicitly as unverifiable from this repository's own record, naming
        which sources were searched, never inferred or fabricated
      - Every M005 amendment (2 contract amends, 2 task-amend calls, the T007
        bootstrap repair) is audited against its journal entry and checkpoint
        marker
      - The Git traceability audit reports trailer coverage and the
        standalone-fix-commit pattern's frequency across all seven M005/M006
        hotfix commits, plus squash/rewrite exposure across M001-M006
      - The audit classifies 85fa243 (chore, ignore local workflow reports)
        separately as a between-milestone maintenance commit, not an eighth
        hotfix, and never merges its count into the seven-hotfix figure
      - Context-efficiency before/after figures are compiled against M006's
        measurements, not re-derived from scratch
      - The CT012 flakiness finding is investigated (the two bounded full-suite
        runs each completed without hanging and left zero surviving processes
        but reported different transient failure sets), and a decision is
        recorded — the cause remains unproven and is explicitly deferred with
        the evidence stated as such, or a specific vitest isolation change is
        adopted — never asserted as proven environmental noise
      - A fresh matched inline/sub-agent dispatch pair is constructed and
        measured under comparable model/config conditions
    write_scope:
      - docs/evidence/M007/dogfood-evidence.md
      - tests/integration/fresh-session-resume.test.ts
      - tests/integration/git-traceability-audit.test.ts
    verification:
      strategy: tdd
      detail: npm test -- tests/integration/fresh-session-resume.test.ts
        tests/integration/git-traceability-audit.test.ts
    result:
      summary: "[truncated] l driver-supplied data (7 hotfixes, 85fa243 separated,
        backup/pre-rewrite-main zero-ancestor finding). CT012: developer chose
        defer over driver's adopt-pool:forks recommendation. Matched pair: real
        sub-agent (31,890 tokens/1 tool/6,901ms) vs inline (unmeasurable in
        isolation, disclosed)."
      evidence: "5/5 target tests pass (fresh-session-resume 1/1,
        git-traceability-audit 4/4), typecheck clean. Redispatch corrected
        mid-flight: original worker stopped (fixed no-git rule contradicted task
        instructions requiring real-repo git auditing); driver took over
        real-repo git/journal inspection, rewrote git-traceability-audit.test.ts
        to synthetic history (no hardcoded real SHAs), executed a real matched
        inline/sub-agent pair. Two amendments applied with developer approval:
        AC013/CT015 conflict-preflight (hash
        sha256:44822b19df58ab3b1d775015ba80d3fa94b06943d5d6eb753bd0d6ecfa8d40bf)
        and T001's own AC#2 interruption-honesty wording."
    attempts: 1
    usage: null
