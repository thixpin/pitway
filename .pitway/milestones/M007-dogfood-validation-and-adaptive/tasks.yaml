        and the always-bounded-timeout rule
      - protocol-driver.md explicitly reinforces that an empty or non-standard
        worker report is never treated as completion evidence
      - protocol-worker.md specifies the git-free RED-check toggle pattern
        (rename via Edit/Write into distinctly-named backup files, never a flat
        same-basename scratch directory, never git)
      - If T009 adopted the dispatch-mode rule, this task's edits to dispatch.md
        and protocol-driver.md build on T009's committed text rather than
        reverting or overwriting it
      - No Core/CLI production code changes anywhere in this task's diff
      - protocol-driver.md states the pre-dispatch conflict-preflight rule
