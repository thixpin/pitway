    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - The design specifies lifecycle states, approved-verification
        hash-gating, journal storage (a new quick_change kind, sibling to
        entry/checkpoint/auto_run), crash recovery, PitWay-Change trailer
        identity and lookup, cancellation, and promotion-to-milestone, naming
        every anticipated file exactly (no directory or glob)
      - The design states explicitly that an arbitrary, unapproved command can
        never execute under this mechanism
      - The design states explicitly whether 85fa243 is the kind of change
        quick-change is meant to cover, and if so, what a PitWay-Change-trailed
        version of that exact commit would have looked like under the designed
        lifecycle
      - The decision is explicit — adopt, defer, or reject
      - No quick-change implementation code exists anywhere in this task's diff,
        regardless of the decision
