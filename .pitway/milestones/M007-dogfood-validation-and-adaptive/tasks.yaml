  - id: T005
    objective: "Design (not implement) a lightweight quick-change/hotfix workflow at
      docs/evidence/M007/quick-change-design.md: lifecycle,
      approved-verification handling, state/journal storage, crash recovery,
      commit identity, PitWay-Change trailer lookup, cancellation, and
