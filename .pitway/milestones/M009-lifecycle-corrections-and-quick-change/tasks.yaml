  - id: T002
    objective: "Implement verification-repair as a real two-phase,
      approve-before-edit lifecycle, usable only when the target milestone is
      in_progress and every non-cancelled task is completed.
      'verification-repair approve <milestone> --file <path>... --check <id>...
      --change-log <text>' rejects an empty or duplicate --file/--check list, a
      --file path resolving outside the repository, and a --check id that is
      unknown or not a command-type check in the contract; it then allocates a
      durable VR\\d{3} id and persists it with its exact approved
      files/checks/rationale as status: pending in a new self-contained-schema
      verification-repairs.yaml (mirroring journal.ts's own local-schema
      precedent) -- an uncommitted write, the same shape as task-update flipping
      a task to in_progress -- with at most one pending VR allowed per
      milestone. No implementation edit is permitted before this.
      'verification-repair commit <milestone> <vr-id>' (run after edits)
      validates the dirty tree is a subset of the approved files plus this
      command's own state files, reruns every approved check by reusing
      src/core/verification/run.ts's own command-check execution and
      verification-results.yaml recording (refusing the whole commit if any
      fails), and only then atomically commits the VR record, the corrected
      files, and the fresh verification-results.yaml entries via commitOrResume,
      carrying both PitWay-Milestone and PitWay-Verification-Repair: VR001
      trailers (src/git/trailers.ts gains this query mode, plus a regression
      test proving non-interference with existing lookups). 'verification-repair
      cancel' is valid only while pending. verification-repairs.yaml is
      initialized empty by src/core/milestones/create.ts (both fresh creation
      and --replace) and included in the baseline commit's expected paths
      (src/git/baseline.ts). src/core/milestones/ complete.ts gains a gate
      refusing completion while any VR for that milestone is still pending.
      Defines and tests retry/resume against a pending VR, pre-commit failure
      (unexpected dirt, or a failed check rerun), post-commit interruption
      (self-healing marker reconciliation, mirroring reconcilePending), and
      ambiguity (a matching-trailer commit whose content diverges) -- refusing
      cleanly in each case. Structurally refuses
      contract.md/tasks.yaml/state.yaml as declared repair targets. CLI:
      src/cli/commands/verification-repair.ts (approve/commit/cancel
      subcommands), registered in src/cli/index.ts. Claude asset:
      src/integrations/claude/commands/verification-repair.md. Updates the three
      command-census arrays for verification-repair (AC002)."
    status: completed
    depends_on:
