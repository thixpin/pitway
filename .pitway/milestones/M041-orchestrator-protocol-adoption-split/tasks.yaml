  - id: T002
    name: Partition-consistency test derived from the decision record
    objective: Add a test that parses the command/role table in
      docs/architecture/orchestrator-role.md and asserts each shipped command
      doc's role annotation matches it, and that protocol-driver.md and
      protocol-orchestrator.md name no command on the wrong side. Never a second
      hardcoded list.
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - A drift between the decision record, a command doc, or a protocol doc
        fails the test by name.
    context_files:
