      session on a draft (producing pending review_recording entries), confirm,
      assert derivePending(readJournal) has zero entries for the milestone and
      that task-dispatch then succeeds under execution.strategy:
      parallel_worktrees; control: an entry whose target differs from HEAD stays
      pending. Executed INLINE and FIRST (decision 1): this milestone's own
      pre-confirmation review leaves exactly such entries pending; inline
      task-update in_progress is not blocked by them, and this task's own
      completion commit clears them."
