      src/core/verification/status.ts. Dominant gap class per the baseline lcov:
      non---json human-render branches and CommandDeps default fallbacks (M020's
      exact pattern). Measure per file with npx vitest run --coverage over this
      task's own test files, parsing lcov BRDA; iterate until every listed file
      clears 90/90. AC008's quality rule applies: real behavioral cases only,
      disclosed-unreachable branches named in completion evidence."
