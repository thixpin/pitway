name: Website Build

# Validates that website/ (an independent npm project, not a workspace
# member of the root package) installs and builds on every push to the
# dedicated website branch and every PR targeting it. Validation only --
# no deploy here, that's a separate workflow.
on:
  push:
    branches: ["website"]
  pull_request:
    branches: ["website"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
