name: Website Deploy

on:
  push:
    branches: ["website"]
  pull_request:
    branches: ["website"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Audit SEO metadata
        run: npm run check:seo

      - name: Audit accessibility signals
        run: npm run check:a11y

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Never on pull_request (a PR only ever gets the build/audit job, never
    # a deploy attempt), and a no-op until the developer completes the
    # external setup below -- an empty AWS_DEPLOY_ROLE_ARN repository
    # variable means there is no AWS OIDC trust relationship, S3 bucket, or
    # CloudFront distribution to deploy to yet, so this job is skipped
    # rather than failing CI.
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write # AWS OIDC -- no long-lived AWS credential stored here
    steps:
      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: website-dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        run: aws s3 sync dist "s3://${{ vars.WEBSITE_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.WEBSITE_CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"

