name: Publish to npm

# Git tag v* -> validate -> test + typecheck -> `npm stage publish`.
# Approval happens on npmjs.com ("Staged Packages" tab, 2FA required) --
# not here. `npm stage approve` can't run under OIDC, so this workflow
# never attempts it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC) -- no NPM_TOKEN secret. Configured on npm's
  # side via `npm trust github --allow-stage-publish` (not --allow-publish).
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Update npm (staged publishing needs npm >= 11.15.0)
        run: npm install -g npm@^11.15.0

      - name: Validate release (tag matches package.json's version)
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match package.json's version $pkg_version" >&2
            exit 1
          fi

      - name: Test release
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Stage package
        run: npm stage publish
