name: Publish to npm

# Two ways to run this: push a `v*` tag (e.g. `v0.1.1`) and it runs
# automatically, or trigger it by hand from the Actions tab
# ("Run workflow" -- workflow_dispatch). A tag-triggered run refuses if the
# tag doesn't match package.json's version, so an accidental/stale tag can
# never publish the wrong thing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC): lets this workflow exchange a short-lived
  # GitHub-issued identity token for npm publish credentials -- no NPM_TOKEN
  # secret needed. Configured on npm's side against this exact repo +
  # workflow filename (thixpin/pitway, publish.yml).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Update npm (Trusted Publishing/OIDC needs npm >= 11.5.1)
        # Pinned to the 11.x line, not @latest: npm 12 requires Node
        # >=22.22.2/24.15.0/26, which this Node 20 runner doesn't have, and
        # broke this exact step. npm 11.5.1's own engine requirement
        # (^20.17.0 || >=22.9.0) is compatible with Node 20.
        run: npm install -g npm@^11.5.1

      - name: Verify the pushed tag matches package.json's version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match package.json's version $pkg_version" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # M029/AC004a: smoke-test the exact artifact that would be published --
      # pack the tarball, install it into a throwaway project, and prove
      # `pitway init` works from the installed binary. A regression here fails
      # the publish instead of reaching npm.
      - name: Smoke test packed tarball
        run: |
          set -e
          npm pack
          PKG=$(ls pitway-*.tgz)
          SMOKE_DIR="$(mktemp -d)"
          git -C "$SMOKE_DIR" init -q
          cd "$SMOKE_DIR"
          npm install --silent "$GITHUB_WORKSPACE/$PKG"
          npx pitway init
          test -f .pitway/config.yaml
          echo "Smoke test passed for $PKG"

      - name: Publish
        run: npm publish

      # M029/AC004b: attach the built tarball to a GitHub Release on tag
      # pushes (workflow_dispatch runs skip this step).
      - name: Create GitHub Release with tarball
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG=$(ls pitway-*.tgz)
          gh release create "$GITHUB_REF_NAME" "$PKG" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes || gh release upload "$GITHUB_REF_NAME" "$PKG" --clobber
