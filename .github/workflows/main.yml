name: Publish to npm

# Two jobs, one file, each gated to its own trigger so nothing runs
# redundantly:
#   - test:  push to main / PR to main (formerly test.yml) -- full suite +
#            coverage + Codecov upload, the source the README's coverage
#            badge reflects.
#   - stage: tag push / manual dispatch -> validate -> `npm stage publish`,
#            gated on the test job (above) actually passing rather than
#            re-running its own copy of test/typecheck. Approval happens
#            on npmjs.com ("Staged Packages" tab, 2FA required) -- not
#            here. `npm stage approve` can't run under OIDC, so this
#            workflow never attempts it.
#
# CodeQL analysis lives in its own workflow (`codeql.yml`), following
# GitHub's default cadence (push/PR/weekly) -- not gated to this file's
# triggers at all, so no `schedule:` trigger is needed here.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC) -- no NPM_TOKEN secret. Configured on npm's
  # side via `npm trust github --allow-stage-publish` (not --allow-publish).
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  stage:
    needs: test
    # A custom `if:` replaces GitHub Actions' implicit needs-success gate,
    # so success() is spelled out explicitly -- otherwise a failed test job
    # would silently let stage proceed anyway.
    if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Update npm (staged publishing needs npm >= 11.15.0)
        run: npm install -g npm@^11.15.0

      - name: Validate release (tag matches package.json's version)
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match package.json's version $pkg_version" >&2
            exit 1
          fi

      - name: Stage package
        run: npm stage publish
