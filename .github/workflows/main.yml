name: Publish to npm

# Three jobs, one file, each gated to its own trigger so nothing runs
# redundantly:
#   - test:   push to main / PR to main (formerly test.yml) -- full suite +
#             coverage + Codecov upload, the source the README's coverage
#             badge reflects.
#   - codeql: weekly cron / manual dispatch / tag push (formerly its own
#             always-on-push/PR codeql.yml -- that cadence duplicated what
#             `test` already covers, so it was dropped).
#   - stage:  tag push / manual dispatch -> validate -> `npm stage publish`,
#             gated on the test job (above) actually passing rather than
#             re-running its own copy of test/typecheck. Approval happens
#             on npmjs.com ("Staged Packages" tab, 2FA required) -- not
#             here. `npm stage approve` can't run under OIDC, so this
#             workflow never attempts it.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Trusted Publishing (OIDC) -- no NPM_TOKEN secret. Configured on npm's
  # side via `npm trust github --allow-stage-publish` (not --allow-publish).
  id-token: write

jobs:
  test:
    # Every trigger except the weekly cron (that one is codeql-only) --
    # including tag-push/workflow_dispatch, so stage below has a real
    # test run in *this* workflow run to depend on, not just a skipped job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  codeql:
    name: CodeQL Analyze (javascript-typescript)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  stage:
    needs: test
    # A custom `if:` replaces GitHub Actions' implicit needs-success gate,
    # so success() is spelled out explicitly -- otherwise a failed test job
    # would silently let stage proceed anyway.
    if: success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Update npm (staged publishing needs npm >= 11.15.0)
        run: npm install -g npm@^11.15.0

      - name: Validate release (tag matches package.json's version)
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match package.json's version $pkg_version" >&2
            exit 1
          fi

      - name: Stage package
        run: npm stage publish
